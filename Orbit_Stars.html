<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a1c33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Звезды с Орбиты — Star Orbit</title>
<style>
  :root{
    --bg1:#14406b; --bg2:#091a30;
    --ink:#f4f7fb; --dim:rgba(244,247,251,.68);
    --sun:#ffd23f; --sun-deep:#c79a12;
    --hot:#ff3d6e; --mint:#5cf2c0;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg2)}
  body{
    position:fixed;inset:0;width:100%;
    background:radial-gradient(120% 90% at 50% 42%, var(--bg1) 0%, var(--bg2) 72%);
    font-family:var(--font);color:var(--ink);
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;
  }
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .hud-btn{
    position:absolute;z-index:6;
    top:calc(env(safe-area-inset-top,0px) + 14px);
    width:46px;height:46px;padding:0;border-radius:50%;
    border:2px solid rgba(244,247,251,.3);background:rgba(9,26,48,.4);
    color:var(--ink);display:grid;place-items:center;cursor:pointer;
  }
  .hud-btn.left{left:calc(env(safe-area-inset-left,0px) + 14px)}
  .hud-btn.right{right:calc(env(safe-area-inset-right,0px) + 14px);display:none}
  .hud-btn:active{transform:scale(.92)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--mint);outline-offset:3px}

  #bestHud{
    position:absolute;z-index:4;left:0;right:0;text-align:center;
    top:calc(env(safe-area-inset-top,0px) + 25px);
    font-weight:700;font-size:16px;line-height:1.25;color:var(--dim);display:none;pointer-events:none;
    padding:0 64px;white-space:pre-line;
  }

  .screen{
    position:absolute;inset:0;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;
    background:rgba(9,26,48,.5);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    transition:opacity .25s ease;
  }
  .screen.hidden{opacity:0;pointer-events:none}
  h1{
    margin:0;font-weight:800;line-height:1;letter-spacing:-.02em;
    font-size:clamp(40px,12.5vw,88px);
  }
  .big{
    font-weight:800;line-height:1;color:var(--sun);letter-spacing:.04em;
    font-size:clamp(76px,26vw,160px);margin:8px 0 2px;
  }
  .screen p{
    margin:14px 0 0;max-width:19em;color:var(--dim);
    font-size:clamp(16px,4.4vw,20px);line-height:1.45;
  }
  .screen p.record{color:var(--sun);font-weight:700}

  .primary,.secondary{
    border-radius:999px;cursor:pointer;touch-action:manipulation;
    font-family:var(--font);
  }
  .primary{
    margin-top:30px;padding:16px 46px;border:0;
    font-weight:800;font-size:clamp(20px,5.4vw,24px);
    background:var(--sun);color:#0a1c33;
    box-shadow:0 6px 0 var(--sun-deep), 0 14px 30px rgba(0,0,0,.35);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .primary:active{transform:translateY(5px);box-shadow:0 1px 0 var(--sun-deep), 0 6px 14px rgba(0,0,0,.35)}
  .primary:disabled{opacity:.6;box-shadow:none;transform:none;cursor:default}
  .secondary{
    margin-top:16px;padding:13px 38px;
    font-weight:700;font-size:clamp(18px,4.8vw,21px);
    background:transparent;color:var(--ink);
    border:2px solid rgba(244,247,251,.5);
  }
  .secondary:active{background:rgba(244,247,251,.12)}
  .link{
    margin-top:18px;padding:8px 14px;border:0;background:none;cursor:pointer;
    font:600 17px var(--font);color:var(--dim);text-decoration:underline;touch-action:manipulation;
  }
  .code{
    margin-top:22px;width:6.4em;padding:10px 0 10px .3em;
    text-align:center;text-transform:uppercase;
    font:800 clamp(30px,9vw,42px) var(--font);letter-spacing:.3em;
    color:var(--ink);background:rgba(255,255,255,.08);
    border:2px solid rgba(244,247,251,.4);border-radius:18px;
    user-select:text;-webkit-user-select:text;touch-action:manipulation;
  }
  .code::placeholder{color:rgba(244,247,251,.3);letter-spacing:.1em;font-size:.6em}
  [hidden]{display:none !important}
  .screen p{white-space:pre-line}
  h1.sm{font-size:clamp(30px,8.6vw,48px)}
  .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  /* главное меню: «Режимы» — большая кнопка 21:9 внизу, «Дорога славы» — 4:3 в правом верхнем углу */
  .link.modebtn{
    position:absolute;left:0;right:0;margin:0 auto;
    bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    width:min(88vw,340px);aspect-ratio:21/9;padding:0 22px;border-radius:26px;
    display:flex;align-items:center;gap:18px;text-align:left;text-decoration:none;
    color:var(--ink);background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
    border:2px solid rgba(244,247,251,.4);
  }
  .link.modebtn svg{flex:none}
  .link.modebtn small{display:block;font:700 13px var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .link.modebtn b{display:block;margin-top:3px;font:800 clamp(18px,5.4vw,23px)/1.15 var(--font)}
  .link.modebtn em{display:block;margin-top:4px;font:600 14px var(--font);font-style:normal;color:var(--sun)}
  .link.modebtn:active,.link.roadbtn:active{background:rgba(244,247,251,.16)}
  .link.roadbtn{
    position:absolute;margin:0;
    top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);
    width:clamp(84px,25vw,108px);aspect-ratio:4/3;padding:6px;border-radius:18px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-decoration:none;
    font:700 13px/1.1 var(--font);color:var(--ink);
    background:rgba(255,255,255,.09);border:2px solid rgba(244,247,251,.4);
  }
  @media (max-height:640px){ .link.modebtn{width:min(70vw,260px)} }

  /* стрелки смены орбиты (режим «3 орбиты») */
  #arrows{
    position:absolute;z-index:6;display:flex;flex-direction:column;gap:16px;
    right:calc(env(safe-area-inset-right,0px) + 14px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 110px);
  }
  .arrow{
    width:64px;height:64px;padding:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    border:2px solid rgba(244,247,251,.45);background:rgba(9,26,48,.55);color:var(--ink);
  }
  .arrow:active{transform:scale(.92);background:rgba(244,247,251,.2)}

  /* списки: режимы и дорога славы */
  .list{
    width:min(100%,440px);margin-top:16px;padding:4px 6px;text-align:left;
    flex:0 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  }
  .list.road{flex:1 1 auto;position:relative}
  .card{
    display:block;width:100%;margin:0 0 12px;padding:14px 16px;text-align:left;
    border-radius:20px;background:rgba(255,255,255,.07);border:2px solid rgba(244,247,251,.18);
    color:var(--ink);font-family:var(--font);cursor:pointer;touch-action:manipulation;
  }
  .card.sel{border-color:var(--sun);background:rgba(255,210,63,.12)}
  .card b{display:block;font-size:20px;font-weight:800}
  .card span{display:block;margin-top:4px;font-size:15px;line-height:1.35;color:var(--dim)}
  .node{
    position:relative;display:flex;align-items:center;gap:14px;
    margin:0 0 12px 28px;padding:12px 14px;border-radius:20px;
    background:rgba(255,255,255,.06);border:2px solid rgba(244,247,251,.14);
    touch-action:pan-y;
  }
  .node::before{
    content:'';position:absolute;left:-17px;top:-8px;bottom:-8px;width:4px;border-radius:2px;
    background:rgba(244,247,251,.16);
  }
  .node:first-child::before{top:50%}
  .node:last-child::before{bottom:50%}
  .node::after{
    content:'';position:absolute;left:-24px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;
    background:var(--bg2);border:3px solid rgba(244,247,251,.28);
  }
  .node.open::before{background:var(--sun)}
  .node.open::after{background:var(--sun);border-color:var(--sun)}
  .node.open{cursor:pointer;background:rgba(255,255,255,.09)}
  .node.sel{border-color:var(--sun);background:rgba(255,210,63,.12)}
  .node .sk{flex:none;width:62px;height:62px;object-fit:contain;transform:scale(1.28);display:block}
  .node .sk.ph{border-radius:50%;transform:scale(.8)}
  .node:not(.open) .sk{filter:brightness(0) opacity(.4)}
  .node .tx{flex:1;min-width:0}
  .node .tx b{display:block;font-size:18px;font-weight:800}
  .node .tx span{display:block;margin-top:3px;font-size:14px;color:var(--dim)}
  .node .bar{margin-top:8px;height:6px;border-radius:3px;background:rgba(244,247,251,.16);overflow:hidden}
  .node .bar i{display:block;height:100%;border-radius:3px;background:var(--mint)}
  .node .tag{flex:none;font-weight:800;font-size:14px;color:var(--sun)}
  .node svg{flex:none;opacity:.55}

  /* настройки звука */
  .srow{display:flex;flex-direction:column;gap:4px;text-align:left}
  .shead{display:flex;justify-content:space-between;align-items:baseline;font:700 19px var(--font)}
  .shead b{color:var(--sun);font-size:17px}
  input[type=range]{width:100%;height:36px;margin:0;accent-color:var(--sun);cursor:pointer;touch-action:pan-y}

  /* подарок при регистрации */
  .giftbox{position:relative;width:min(66vw,230px);height:min(66vw,230px);margin:0 auto;overflow:hidden}
  .giftbox .glow{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(255,210,63,.5),rgba(255,210,63,0) 68%);animation:gglow 2.2s ease-in-out infinite}
  .giftbox .gimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scale(1.15);animation:gpop .8s cubic-bezier(.2,1.4,.4,1) both,gfloat 3s ease-in-out .8s infinite}
  .giftbox .gimg.ph{inset:14%;width:72%;height:72%;border-radius:50%}
  .giftbox .conf{position:absolute;top:-8%;width:8px;height:14px;border-radius:2px;opacity:0;animation:cfall linear infinite;pointer-events:none}
  @keyframes gpop{from{transform:scale(0) rotate(-25deg);opacity:0}to{transform:scale(1.15) rotate(0);opacity:1}}
  @keyframes gfloat{0%,100%{transform:scale(1.15) translateY(0)}50%{transform:scale(1.15) translateY(-8px)}}
  @keyframes gglow{0%,100%{opacity:.55;transform:scale(.92)}50%{opacity:1;transform:scale(1.05)}}
  @keyframes cfall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(260px) rotate(540deg);opacity:0}}
  @media (prefers-reduced-motion: reduce){ .giftbox *{animation:none !important} .giftbox .gimg{transform:scale(1.15);opacity:1} }

  /* кнопка «Инвентарь» под «Дорогой славы» */
  .link.invbtn{
    position:absolute;margin:0;
    top:calc(env(safe-area-inset-top,0px) + 14px + clamp(84px,25vw,108px) * .75 + 10px);
    right:calc(env(safe-area-inset-right,0px) + 14px);
    width:clamp(84px,25vw,108px);aspect-ratio:4/3;padding:6px;border-radius:18px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-decoration:none;
    font:700 13px/1.1 var(--font);color:var(--ink);
    background:rgba(255,255,255,.09);border:2px solid rgba(244,247,251,.4);
  }
  .link.invbtn:active{background:rgba(244,247,251,.16)}
  /* инвентарь: сетка шаров */
  .list.inv{flex:1 1 auto}
  .invgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:6px 2px 10px}
  .slot{
    display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;
    border-radius:20px;background:rgba(255,255,255,.07);border:2px solid rgba(244,247,251,.18);
    color:var(--ink);font-family:var(--font);cursor:pointer;touch-action:manipulation;
  }
  .slot.sel{border-color:var(--sun);background:rgba(255,210,63,.12)}
  .slot .sk{width:66px;height:66px;object-fit:contain;transform:scale(1.25);display:block;margin:4px 0}
  .slot .sk.ph{border-radius:50%;transform:scale(.8)}
  .slot b{font-size:14px;font-weight:800;line-height:1.15;text-align:center}
  .slot span{font-size:13px;font-weight:700;color:var(--dim)}
  .slot.sel span{color:var(--sun)}

  /* кнопка «Аккаунт» рядом со звуком */
  .hud-btn.left2{left:calc(env(safe-area-inset-left,0px) + 70px)}

  /* формы (вход, регистрация, аккаунт) */
  .screen.form{justify-content:flex-start;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch}
  .screen.form::before,.screen.form::after{content:'';flex:1 0 0}
  .form-box{width:min(100%,340px);margin-top:18px;display:flex;flex-direction:column;gap:12px;flex:none}
  .fld{
    width:100%;padding:13px 16px;text-align:left;
    font:600 17px var(--font);color:var(--ink);
    background:rgba(255,255,255,.08);border:2px solid rgba(244,247,251,.4);border-radius:16px;
    user-select:text;-webkit-user-select:text;touch-action:manipulation;
  }
  .fld::placeholder{color:rgba(244,247,251,.35)}
  .flab{margin:4px 4px -6px;text-align:left;font:700 13px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
  .fnote{font:600 15px/1.4 var(--font);color:var(--dim);text-align:center;white-space:pre-line;user-select:text;-webkit-user-select:text}
  .fnote.warn{color:var(--sun)}
  .fnote.err{color:var(--hot)}
  .fnote.ok{color:var(--mint)}

  /* выбор числа игроков внутри карточки режима */
  .chips{display:flex;gap:8px;margin-top:12px}
  .chip{
    flex:1;padding:9px 4px;border-radius:14px;cursor:pointer;touch-action:manipulation;
    border:2px solid rgba(244,247,251,.25);background:rgba(255,255,255,.06);
    color:var(--ink);font:700 14px var(--font);
  }
  .chip.on{border-color:var(--sun);background:rgba(255,210,63,.18);color:var(--sun)}
  .chip:active{background:rgba(244,247,251,.16)}

  /* лобби онлайн-игры: список игроков */
  .list.plist{display:flex;flex-direction:column;gap:10px;padding:2px 4px}
  .prow{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 16px;border-radius:18px;
    background:rgba(255,255,255,.07);border:2px solid rgba(244,247,251,.18);
  }
  .prow b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:18px;font-weight:800}
  .prow span{flex:none;font-size:15px;font-weight:700;color:var(--dim)}
  .prow.me{border-color:var(--sun);background:rgba(255,210,63,.12)}
  .prow.me span{color:var(--sun)}
  .prow.empty{border-style:dashed;background:transparent}
  .prow.empty b{font-weight:600;color:var(--dim)}

  /* главное меню: ничего не накладывается друг на друга.
     Сверху и снизу резервируем место под угловые кнопки и «Режимы», середина сжимается по высоте экрана,
     а на совсем низком экране меню можно прокрутить. */
  .screen.menu{
    --vh:1vh; --sb:clamp(84px,25vw,108px); --mw:min(88vw,340px,calc(var(--vh) * 39.7));
    justify-content:flex-start;overflow-x:hidden;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;
    padding-top:calc(env(safe-area-inset-top,0px) + 28px + var(--cornerH, calc(var(--sb) * 1.48)));
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 34px + var(--modeH, calc(var(--mw) * .4286)));
  }
  @supports (height:1dvh){ .screen.menu{--vh:1dvh} }
  .screen.menu::before,.screen.menu::after{content:'';flex:1 0 0}
  .screen.menu h1{font-size:clamp(30px,min(11vw,calc(var(--vh) * 6)),72px)}
  .screen.menu p{margin-top:10px;font-size:clamp(14px,3.9vw,18px)}
  .screen.menu .primary{margin-top:20px;padding:13px 40px}
  .screen.menu .secondary{margin-top:12px;padding:11px 34px}
  .link.modebtn{width:var(--mw)}
  .link.roadbtn,.link.invbtn{
    --sb:clamp(84px,25vw,108px);
    width:var(--sb);height:calc(var(--sb) * .74);aspect-ratio:auto;padding:4px;gap:3px;font-size:12px;
  }
  .link.invbtn{top:calc(env(safe-area-inset-top,0px) + 14px + var(--roadH, calc(var(--sb) * .74)) + 8px)}
  .link.roadbtn svg,.link.invbtn svg{width:24px;height:24px}
  @media (max-height:600px){ .screen.menu p{display:none} }

  /* кнопки-картинки (папка Textures): рамку и фон рисует сама картинка */
  .screen .imgbtn.imgbtn{
    background:none;border:0;box-shadow:none;padding:0;border-radius:0;aspect-ratio:auto;
    width:auto;height:auto;display:block;gap:0;text-decoration:none;line-height:0;
  }
  .imgbtn img{display:block;width:auto;height:var(--ih,56px);max-width:86vw;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
  .imgbtn:active{transform:scale(.96);filter:brightness(.9)}
  .screen .imgbtn.imgbtn:active{box-shadow:none}
  .imgbtn.ui-play{--ih:68px}
  .imgbtn.ui-online,.imgbtn.ui-friends,.imgbtn.ui-join{--ih:58px}
  .imgbtn.ui-create,.imgbtn.ui-save,.imgbtn.ui-done{--ih:62px}
  .imgbtn.ui-back{--ih:48px}
  .screen .imgbtn.ui-modes{width:var(--mw);text-align:center;line-height:1.2}
  .imgbtn.ui-modes img{width:100%;height:auto;max-height:calc(var(--vh,1vh) * 17);margin:0 auto}
  .imgbtn.ui-road img,.imgbtn.ui-inventory img{width:calc(var(--sb) * .82);height:auto}
  .imgbtn .cap{display:block;margin-top:6px;font:700 13px/1.2 var(--font);color:var(--sun);text-shadow:0 1px 4px rgba(0,0,0,.65)}
  .imgbtn:disabled{opacity:.6}

  /* стартовый экран и экран загрузки */
  .splash{
    position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px;text-align:center;touch-action:none;
    background:radial-gradient(120% 90% at 50% 42%, var(--bg1) 0%, var(--bg2) 72%);
    transition:opacity .45s ease;
  }
  .splash.off{opacity:0;pointer-events:none}
  .sp-co{
    margin-bottom:clamp(30px,9vh,70px);
    font-weight:800;font-size:clamp(24px,7.4vw,42px);letter-spacing:.14em;color:var(--sun);
    animation:spIn .8s ease both;
  }
  .sp-main{display:flex;flex-direction:column;align-items:center;animation:spIn .9s ease .6s both}
  .sp-title{font-weight:800;line-height:1.02;letter-spacing:-.02em;font-size:clamp(36px,11vw,72px);max-width:9em}
  .sp-bar{width:min(68vw,300px);height:8px;margin-top:clamp(26px,7vh,52px);border-radius:4px;background:rgba(244,247,251,.16);overflow:hidden}
  .sp-bar i{display:block;width:0;height:100%;border-radius:4px;background:var(--mint)}
  .sp-info{margin-top:12px;font-weight:700;font-size:16px;color:var(--dim)}
  .splash.load .sp-co{display:none}
  .splash.load .sp-main{animation:none}
  @keyframes spIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ .sp-co,.sp-main{animation:none} }

  /* ============================================================
     НОВЫЙ ЗАГРУЗОЧНЫЙ ЭКРАН И ГЛАВНОЕ МЕНЮ
     ============================================================ */

  /* ---------- Загрузочный экран ---------- */
  .splash{
    background:
      radial-gradient(circle at 20% 30%, rgba(79,172,254,.22), transparent 55%),
      radial-gradient(circle at 80% 70%, rgba(168,85,247,.22), transparent 55%),
      linear-gradient(160deg, #060a14 0%, #0d1730 50%, #060a14 100%);
    overflow:hidden;
  }
  .splash::before{
    content:'';position:absolute;inset:-50%;
    background:
      radial-gradient(circle at 30% 40%, rgba(79,172,254,.08), transparent 30%),
      radial-gradient(circle at 70% 60%, rgba(168,85,247,.08), transparent 30%);
    animation:spGlow 6s ease-in-out infinite;
    pointer-events:none;
  }

let W = 0, H = 0, S = 0, cx = 0, cy = 0, dpr = 1, R = [0, 0], BAND = 0, PR = 0;
let G = null;
const pos = (a, r) => [cx + Math.sin(a) * r, cy - Math.cos(a) * r];
function radii(n){ return n === 3 ? [S * 0.25, S * 0.33, S * 0.41] : [S * 0.25, S * 0.41]; }
function setOrbits(n){
  ORB = n === 3 ? 3 : 2; R = radii(ORB);
  if (G){ G.lane = Math.min(G.lane, ORB - 1); G.r = R[G.lane]; }
  for (const o of opps){ o.lane = Math.min(o.lane, ORB - 1); o.r = R[o.lane]; }
}

function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(W, H * 0.92);
  cx = W / 2; cy = H * 0.47;
  R = radii(ORB);
  BAND = S * 0.05;
  PR = S * 0.03;
  if (G){ G.r = R[G.lane]; const p = pos(G.angle, G.r); G.px = p[0]; G.py = p[1]; G.trail.length = 0; }
  for (const o of opps) o.r = R[o.lane];
  fitMenu();
}

/* ---------- Состояние ---------- */
let mode = 'menu';
let bgRot = 0, acc = 0, cd = 0;
const bgImgs = {};
const bgCache = { key: '', cv: null };
function loadBg(){
  [['day', 'Textures/background.jpg'], ['ny', 'Textures/background-new-year.jpg']].forEach(([k, f]) => {
    const im = new Image(); LOAD.total++;
    im.onload = () => { bgImgs[k] = im; bgCache.key = ''; assetDone(); };
    im.onerror = assetDone;
    im.src = f;
  });
}
function isWinter(){ const m = new Date().getMonth(); return m === 11 || m === 0 || m === 1; }
function drawBg(){
  const k = isWinter() && bgImgs.ny ? 'ny' : 'day', im = bgImgs[k];
  if (!im) return false;
  const key = k + W + 'x' + H + '@' + dpr;
  if (bgCache.key !== key){
    const c = bgCache.cv || (bgCache.cv = document.createElement('canvas'));
    c.width = Math.round(W * dpr); c.height = Math.round(H * dpr);
    const x = c.getContext('2d'), f = Math.max(c.width / im.naturalWidth, c.height / im.naturalHeight);
    const w = im.naturalWidth * f, h = im.naturalHeight * f;
    x.imageSmoothingQuality = 'high';
    x.drawImage(im, (c.width - w) / 2, (c.height - h) / 2, w, h);
    bgCache.key = key;
  }
  ctx.drawImage(bgCache.cv, 0, 0, W, H);
  return true;
}
const dust = Array.from({ length: 56 }, () => ({
  a: Math.random() * TAU, r: 0.06 + Math.random() * 0.72,
  s: 0.6 + Math.random() * 1.6, o: 0.12 + Math.random() * 0.35, z: 0.3 + Math.random() * 0.9
}));

let multi = false;
const NET = { client: null, ch: null, code: '', host: false, myId: Math.random().toString(36).slice(2, 10), lastSend: 0, sendT: 0, off: null, offRtt: Infinity, pingT: 0,
  online: false, need: 2, orb: 2, order: null, idx: 0, group: [], info: {}, seen: 0, token: 0, startT: 0, joinT: 0 };
const match = { active: false, startLocal: 0, hostAt: 0 };
let opps = [];
let overTextFn = null;
const oppAngle = o => G.angle - G.off + o.off;
const startLane = (i, n) => Math.round((ORB - 1) * (1 - i / Math.max(1, n - 1)));
let myRematch = false;

function newGame(seed, lane, idx, np){
  rng = (seed == null) ? Math.random : mulberry32(seed);
  if (lane == null) lane = 1;
  np = seed != null ? (np || 2) : 1;
  idx = idx || 0;
  const off = idx * TAU / np;
  const p = pos(off, R[lane]);
  G = {
    np, idx, off, stepN: 0, spawnN: 0,
    t: 0, angle: off, lane, r: R[lane], px: p[0], py: p[1],
    speed: 2.0, world: 0, ow: 0,
    obs: [], stars: [], parts: [], pops: [], trail: [],
    score: 0, combo: 0, comboT: 0, scorePulse: 0, squash: 0,
    nextObs: 3.6, nextStar: 0.7, shake: 0, flash: 0,
    dead: false, deadT: 0, taps: 0, lastFlip: 0, pulse: null
  };
}

/* ---------- Эффекты ---------- */
function burst(x, y, color, n, speed, size){
  for (let i = 0; i < n; i++){
    const a = Math.random() * TAU, v = speed * (0.25 + Math.random() * 0.75);
    const life = 0.45 + Math.random() * 0.5;
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, c: color, s: size * (0.5 + Math.random()) });
  }
  if (G.parts.length > 240) G.parts.splice(0, G.parts.length - 240);
}
function fxUpdate(dt){
  const g = G, damp = Math.pow(0.04, dt);
  for (let i = g.parts.length - 1; i >= 0; i--){
    const p = g.parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= damp; p.vy *= damp; p.life -= dt;
    if (p.life <= 0) g.parts.splice(i, 1);
  }
  for (let i = g.pops.length - 1; i >= 0; i--){
    const p = g.pops[i]; p.t += dt; if (p.t > 0.7) g.pops.splice(i, 1);
  }
  g.shake = Math.max(0, g.shake - dt * 40);
  g.flash = Math.max(0, g.flash - dt * 3);
  g.scorePulse = Math.max(0, g.scorePulse - dt * 5);
  g.squash = Math.max(0, g.squash - dt * 6);
  if (g.pulse){ g.pulse.t += dt; if (g.pulse.t > 0.45) g.pulse = null; }
}

function spawnBase(){
  const g = G;
  return g.angle - g.off + (g.np > 1 ? (g.spawnN++ % g.np) * (TAU / g.np) : 0);
}
function spawnObs(){
  const g = G;
  if (g.obs.length >= (ORB === 3 ? 10 : 7)) return;
  const base = spawnBase();
  const half = 0.28 + rng() * 0.32 + Math.min(0.25, g.t * 0.004);
  const gap = Math.max(0.75, 1.1 - g.t * 0.004);
  for (let k = 0; k < 8; k++){
    const lane = Math.floor(rng() * ORB);
    const a = base - g.world + 2.2 + rng() * 2.2;
    let ok = true;
    for (const o of g.obs){
      if (Math.abs(angDiff(a, o.a)) < half + o.half + (o.lane === lane ? 0.25 : gap)){ ok = false; break; }
    }
    if (ok) for (const s of g.stars){
      if (s.lane === lane && Math.abs(angDiff(a, s.a)) < half + 0.3){ ok = false; break; }
    }
    if (ok){
      g.obs.push({ lane, a, half, age: 0, warn: 0.85, life: 3.2 + rng() * 1.6, live: false });
      return;
    }
  }
}
function spawnStars(){
  const g = G, lane = Math.floor(rng() * ORB);
  const base = spawnBase();
  const count = rng() < 0.55 ? 3 : 1;
  const a0 = base - g.world + 1.4 + rng() * 1.8;
  for (let i = 0; i < count; i++){
    const a = a0 + i * 0.34;
    let ok = true;
    for (const o of g.obs){
      if (o.lane === lane && Math.abs(angDiff(a, o.a)) < o.half + 0.3){ ok = false; break; }
    }
    if (ok) g.stars.push({ lane, a, age: 0, life: 6, taken: false });
  }
}

function overlaps(o){
  const g = G, r = R[o.lane];
  if (Math.abs(g.r - r) > BAND * 0.5 + PR * 0.7) return false;
  const tol = o.half + (BAND * 0.5) / r + (PR * 0.75) / Math.max(g.r, 1);
  return Math.abs(angDiff(g.angle, o.a + g.world)) < tol;
}
function arcNear(o, pad, ang){
  const tol = o.half + (BAND * 0.5) / R[o.lane] + (PR * 0.75) / R[0] + pad;
  return Math.abs(angDiff(ang, o.a + G.world)) < tol;
}
function inArc(o, pad){
  const base = G.angle - G.off;
  for (let k = 0; k < G.np; k++) if (arcNear(o, pad, base + k * TAU / G.np)) return true;
  return false;
}

function update(dt){
  const g = G;
  g.t += dt;
  g.speed = 2.0 + Math.min(1.4, g.t * 0.016);
  g.ow = 0.85 * Math.sin(g.t * 0.4) * Math.min(1, g.t / 12);
  g.world += g.ow * dt;
  g.angle += g.speed * dt;
  g.r += (R[g.lane] - g.r) * Math.min(1, dt * 14);
  const p = pos(g.angle, g.r);
  g.px = p[0]; g.py = p[1];
  g.trail.push([g.px, g.py]); if (g.trail.length > 16) g.trail.shift();
  if (multi){
    for (const o of opps){
      o.r += (R[o.lane] - o.r) * Math.min(1, dt * 14);
      if (o.present && !o.dead && !o.left){
        const gp = pos(oppAngle(o), o.r);
        o.trail.push([gp[0], gp[1]]); if (o.trail.length > 16) o.trail.shift();
      }
    }
  }

  g.nextObs -= dt;
  if (g.nextObs <= 0){
    spawnObs();
    g.nextObs = Math.max(0.55, 1.6 - g.t * 0.014) * (0.75 + rng() * 0.5) * (ORB === 3 ? 0.8 : 1);
  }
  g.nextStar -= dt;
  if (g.nextStar <= 0 && g.stars.length <= 3){
    spawnStars();
    g.nextStar = 1.3 + rng() * 0.8;
  }

  for (let i = g.obs.length - 1; i >= 0; i--){
    const o = g.obs[i];
    o.age += dt;
    if (!o.live && o.age >= o.warn){
      if (inArc(o, 0.3)) o.age = o.warn - 0.001; else o.live = true;
    }
    const end = o.warn + o.life;
    if (o.live && o.age < end && overlaps(o)){ die(); return; }
    if (o.age > end + 0.3) g.obs.splice(i, 1);
  }

  for (let i = g.stars.length - 1; i >= 0; i--){
    const s = g.stars[i];
    s.age += dt;
    if (!s.taken){
      const sp = pos(s.a + g.world, R[s.lane]);
      if (Math.hypot(sp[0] - g.px, sp[1] - g.py) < PR * 2.0){
        s.taken = true;
        g.combo = g.comboT > 0 ? Math.min(5, g.combo + 1) : 1;
        g.comboT = 2.4;
        g.score += g.combo;
        g.scorePulse = 1;
        burst(sp[0], sp[1], '#5cf2c0', 14, S * 0.5, S * 0.012);
        g.pops.push({ x: sp[0], y: sp[1] - PR, t: 0, text: '+' + g.combo });
        sfx(g.combo >= 2 ? 'coins' : 'coin', 1, () => { tone(NOTES[g.combo], .16, 'sine', .14); tone(NOTES[g.combo] * 2, .1, 'triangle', .04); });
        buzz(10);
      }
    }
    if (s.age > s.life) g.stars.splice(i, 1);
  }

  if (g.comboT > 0){ g.comboT -= dt; if (g.comboT <= 0) g.combo = 0; }
  fxUpdate(dt);
}

function idle(dt){
  const g = G;
  g.t += dt; g.angle += 1.1 * dt; g.world += 0.12 * dt;
  const f = Math.floor(g.t / 1.8);
  if (f !== g.lastFlip){ g.lastFlip = f; const seq = ORB === 3 ? [2, 1, 0, 1] : [1, 0]; g.lane = seq[((f % seq.length) + seq.length) % seq.length]; }
  g.r += (R[g.lane] - g.r) * Math.min(1, dt * 6);
  const p = pos(g.angle, g.r); g.px = p[0]; g.py = p[1];
  g.trail.push([g.px, g.py]); if (g.trail.length > 16) g.trail.shift();
  fxUpdate(dt);
}

function die(){
  const g = G;
  g.dead = true; g.deadT = 0; mode = 'dying';
  g.shake = 16; g.flash = 1;
  burst(g.px, g.py, skinById(skinSel).c, 46, S * 0.9, S * 0.016);
  burst(g.px, g.py, '#ff3d6e', 20, S * 0.6, S * 0.012);
  sfx('defeat', 1, () => tone(260, .55, 'sawtooth', .16, 45));
  buzz([40, 30, 80]);
  bankScore();
  pauseBtn.style.display = 'none';
  netSend(true);
}
function bankScore(){
  const g = G;
  if (g.banked) return;
  g.banked = true;
  newRecord = g.score > bests[ORB];
  if (newRecord){ bests[ORB] = g.score; store.set(bestKey(ORB), String(g.score)); }
  const before = glory;
  glory += g.score; store.set('orbit-glory', String(glory));
  pendingUnlocks = SKINS.filter(k => !k.hidden && !k.gift && k.need > before && k.need <= glory);
  syncProgress();
}

/* ---------- Рисование ---------- */
function starPath(x, y, r, rot){
  ctx.beginPath();
  for (let i = 0; i < 10; i++){
    const rr = i % 2 ? r * 0.45 : r, a = rot + i * Math.PI / 5;
    const px = x + Math.sin(a) * rr, py = y - Math.cos(a) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}
function arcAt(r, center, half){
  ctx.beginPath();
  ctx.arc(cx, cy, r, center - half, center + half);
}

const oppSkinId = o => o.skin === 'standard' ? (opps.indexOf(o) === 0 ? 'standard-2' : 'standard-3') : o.skin;
function drawBall(x, y, id, pr, alpha){
  const sk = skinById(id), im = skinCanvas[id];
  ctx.save();
  ctx.globalAlpha = alpha * 0.22; ctx.fillStyle = sk.c;
  ctx.beginPath(); ctx.arc(x, y, pr * 1.8, 0, TAU); ctx.fill();
  ctx.globalAlpha = alpha;
  if (im){
    const k = pr * 2 / Math.max(im.width, im.height), w = im.width * k, h = im.height * k;
    ctx.drawImage(im, x - w / 2, y - h / 2, w, h);
  } else {
    const rr = pr * 0.78;
    ctx.fillStyle = sk.c;
    ctx.beginPath(); ctx.arc(x, y, rr, 0, TAU); ctx.fill();
    ctx.globalAlpha = alpha * 0.55; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x - rr * 0.25, y - rr * 0.25, rr * 0.42, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawObstacle(o){
  const g = G, r = R[o.lane], ca = o.a + g.world - Math.PI / 2, end = o.warn + o.life;
  if (o.age < o.warn || !o.live){
    ctx.save();
    ctx.setLineDash([S * 0.016, S * 0.022]);
    ctx.lineWidth = 3; ctx.lineCap = 'butt';
    ctx.strokeStyle = 'rgba(255,61,110,' + (0.4 + 0.4 * Math.abs(Math.sin(o.age * 14))) + ')';
    arcAt(r, ca, o.half + (BAND * 0.5) / r); ctx.stroke();
    ctx.restore();
    return;
  }
  let k = 1;
  if (o.age > end) k = Math.max(0, 1 - (o.age - end) / 0.3);
  ctx.save();
  ctx.globalAlpha = k;
  ctx.lineCap = 'round';
  ctx.lineWidth = BAND * 1.8 * k; ctx.strokeStyle = 'rgba(255,61,110,.18)';
  arcAt(r, ca, o.half); ctx.stroke();
  ctx.lineWidth = BAND * k; ctx.strokeStyle = '#ff3d6e';
  arcAt(r, ca, o.half); ctx.stroke();
  ctx.lineWidth = BAND * 0.26 * k; ctx.strokeStyle = 'rgba(255,255,255,.5)';
  arcAt(r - BAND * 0.17, ca, o.half * 0.94); ctx.stroke();
  ctx.restore();
}

function showsScore(){ return mode === 'play' || mode === 'pause' || mode === 'dying' || mode === 'wait' || mode === 'over'; }

function draw(){
  const g = G;
  ctx.clearRect(0, 0, W, H);
  const hasBg = drawBg();
  ctx.save();
  if (g.shake > 0.2 && !reduce) ctx.translate((Math.random() - .5) * g.shake, (Math.random() - .5) * g.shake);

  if (!hasBg){
    ctx.fillStyle = '#bfe3ff';
    for (const d of dust){
      const a = d.a + bgRot * d.z;
      ctx.globalAlpha = d.o;
      ctx.beginPath();
      ctx.arc(cx + Math.sin(a) * d.r * S, cy - Math.cos(a) * d.r * S, d.s, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  for (let i = 0; i < ORB; i++){
    ctx.lineWidth = BAND * 0.34;
    ctx.strokeStyle = g.lane === i ? 'rgba(160,210,245,.30)' : 'rgba(160,210,245,.15)';
    ctx.beginPath(); ctx.arc(cx, cy, R[i], 0, TAU); ctx.stroke();
    if (g.pulse && g.pulse.lane === i){
      ctx.lineWidth = BAND * 0.5;
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.55 * (1 - g.pulse.t / 0.45)) + ')';
      ctx.beginPath(); ctx.arc(cx, cy, R[i], 0, TAU); ctx.stroke();
    }
    const n = Math.round(TAU * R[i] / (S * 0.05));
    ctx.fillStyle = 'rgba(200,230,250,.5)';
    for (let k = 0; k < n; k++){
      const a = g.world + k * TAU / n;
      ctx.beginPath();
      ctx.arc(cx + Math.sin(a) * R[i], cy - Math.cos(a) * R[i], 1.6, 0, TAU);
      ctx.fill();
    }
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (mode === 'count'){
    const n = Math.ceil(cd - 0.2);
    ctx.font = '800 ' + Math.round(S * (n > 0 ? 0.3 : 0.15)) + 'px ' + FONT;
    ctx.fillStyle = '#ffd23f';
    ctx.fillText(n > 0 ? String(n) : 'Вперёд!', cx, cy);
  } else if (showsScore()){
    const sc = 1 + g.scorePulse * 0.18;
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(sc, sc);
    ctx.font = '800 ' + Math.round(S * 0.2) + 'px ' + FONT;
    ctx.fillStyle = '#f4f7fb';
    ctx.fillText(String(g.score), 0, 0);
    ctx.restore();
    if (g.combo > 1){
      ctx.font = '800 ' + Math.round(S * 0.058) + 'px ' + FONT;
      ctx.fillStyle = '#5cf2c0';
      ctx.fillText('×' + g.combo, cx, cy + S * 0.145);
    }
    if (g.combo > 0 && g.comboT > 0){
      ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(92,242,192,.7)';
      ctx.beginPath();
      ctx.arc(cx, cy, S * 0.2, -Math.PI / 2, -Math.PI / 2 + TAU * (g.comboT / 2.4));
      ctx.stroke();
    }
  }

  for (const s of g.stars){
    if (s.taken) continue;
    const sp = pos(s.a + g.world, R[s.lane]);
    const sc = Math.min(1, s.age / 0.25);
    const left = s.life - s.age;
    ctx.globalAlpha = (left < 1.2 && Math.floor(s.age * 10) % 2) ? 0.35 : 1;
    ctx.fillStyle = 'rgba(92,242,192,.18)';
    ctx.beginPath(); ctx.arc(sp[0], sp[1], PR * 1.9 * sc, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5cf2c0';
    starPath(sp[0], sp[1], PR * 1.15 * sc, s.age * 1.5); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const o of g.obs) drawObstacle(o);

  if (multi && (mode === 'play' || mode === 'count' || mode === 'dying')){
    for (const o of opps){
      if (!o.present || o.dead || o.left) continue;
      const gp = pos(oppAngle(o), o.r), pr = PR * 1.35, oid = oppSkinId(o);
      ctx.fillStyle = skinById(oid).c;
      for (let i = 0; i < o.trail.length; i++){
        const t = i / o.trail.length;
        ctx.globalAlpha = t * 0.35;
        ctx.beginPath(); ctx.arc(o.trail[i][0], o.trail[i][1], PR * (0.3 + 0.6 * t), 0, TAU); ctx.fill();
      }
      ctx.globalAlpha = 1;
      drawBall(gp[0], gp[1], oid, pr, 0.95);
      ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.75)';
      ctx.beginPath(); ctx.arc(gp[0], gp[1], pr * 1.35, 0, TAU); ctx.stroke();
    }
  }

  if (!g.dead){
    const L = g.trail.length;
    ctx.fillStyle = skinById(skinSel).c;
    for (let i = 0; i < L; i++){
      const t = i / L;
      ctx.globalAlpha = t * 0.35;
      ctx.beginPath(); ctx.arc(g.trail[i][0], g.trail[i][1], PR * (0.3 + 0.6 * t), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawBall(g.px, g.py, skinSel, PR * 1.35 * (1 + 0.3 * g.squash), 1);
  }

  for (const p of g.parts){
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.font = '800 ' + Math.round(S * 0.05) + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#5cf2c0';
  for (const p of g.pops){
    ctx.globalAlpha = 1 - p.t / 0.7;
    ctx.fillText(p.text, p.x, p.y - p.t * S * 0.12);
  }
  ctx.globalAlpha = 1;

  if (mode === 'play' && g.taps < 2 && g.t > 0.3){
    ctx.font = '700 ' + Math.max(16, Math.round(S * 0.045)) + 'px ' + FONT;
    ctx.fillStyle = 'rgba(244,247,251,' + (0.55 + 0.35 * Math.sin(g.t * 5)) + ')';
    const hy = H - Math.max(70, H * 0.09), fs = Math.max(16, Math.round(S * 0.045));
    if (ORB === 2) ctx.fillText('Коснись экрана — смени орбиту', cx, hy);
    else {
      ctx.fillText('Коснись нужной орбиты', cx, hy - fs * 0.75);
      ctx.fillText('или жми стрелки справа', cx, hy + fs * 0.75);
    }
  }

  ctx.restore();

  if (g.flash > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + (g.flash * 0.35) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* ---------- Интерфейс ---------- */
const ov = document.getElementById('ov');
const ovTitle = document.getElementById('ovTitle');
const ovBig = document.getElementById('ovBig');
const ovText = document.getElementById('ovText');

const uiOk = {};
const LOAD = { total: 0, done: 0, wait: null };
function assetDone(){
  LOAD.done++;
  Loader.setAssets(LOAD.total ? LOAD.done / LOAD.total : 1);
  if (LOAD.wait && LOAD.done >= LOAD.total){ const w = LOAD.wait; LOAD.wait = null; w(); }
}
function assetsReady(ms){
  return new Promise(res => {
    if (LOAD.done >= LOAD.total) return res();
    LOAD.wait = res; setTimeout(res, ms);
  });
}
function loadUi(){
  for (const label in UI){
    LOAD.total++;
    const im = new Image();
    im.onload = () => { uiOk[label] = true; assetDone(); };
    im.onerror = assetDone;
    im.src = 'Textures/' + UI[label][1];
  }
}
function uiImg(file){
  const im = new Image(); im.alt = ''; im.draggable = false;
  im.onload = () => fitMenu();
  im.src = 'Textures/' + file;
  return im;
}
function applyStaticUi(){
  const b = document.getElementById('setDone');
  if (!b || !uiOk['Готово']) return;

  b.textContent = ''; b.appendChild(uiImg(UI['Готово'][1]));

}
function fitMenu(){

}

const Loader = (() => {
  const el = document.getElementById('splash'), bar = document.getElementById('spBar'), info = document.getElementById('spInfo');
  const L = { on: false, mode: 'intro', assets: 0, boot: 0, cur: 0, label: '', t0: Date.now(), min: 0, wantHide: false };
  const target = () => L.mode === 'intro' ? 80 * L.assets + 20 * L.boot : 100 * L.boot;
  L.show = (mode, label) => {
    L.on = true; L.mode = mode; L.boot = 0; L.cur = 0; L.t0 = Date.now(); L.wantHide = false;
    L.min = mode === 'intro' ? 2600 : 450;
    L.label = label || (mode === 'intro' ? 'Загрузка данных' : 'Загрузка');
    el.className = 'splash ' + mode; el.hidden = false;
    info.textContent = L.label + '… 0%'; bar.style.width = '0%';
  };
  L.setAssets = f => { L.assets = f; };
  L.setBoot = f => { L.boot = Math.max(L.boot, f); };
  L.finish = () => { L.boot = 1; L.wantHide = true; };
  L.tick = dt => {
    if (!L.on) return;
    const tg = target();
    L.cur = Math.min(tg, L.cur + Math.max((tg - L.cur) * dt * 5, dt * 12));
    bar.style.width = L.cur.toFixed(1) + '%';
    const t = L.label + '… ' + Math.round(L.cur) + '%';
    if (info.textContent !== t) info.textContent = t;
    if (L.wantHide && L.cur >= 99.5 && Date.now() - L.t0 >= L.min && (L.mode !== 'intro' || L.assets >= 1)){
      L.on = false; el.classList.add('off');
      setTimeout(() => { if (!L.on) el.hidden = true; }, 500);
    }
  };
  return L;
})();
async function startApp(){
  await assetsReady(8000);
  Loader.setAssets(1);
  applyStaticUi();
  try { await boot(); } finally { Loader.finish(); }
}

let lastAction = 0;
function setBtn(el, spec){
  if (!spec){ el.hidden = true; el.onclick = null; return; }
  el.hidden = false;
  const ui = uiOk[spec[0]] ? UI[spec[0]] : null;
  el.className = el.dataset.base + (spec[2] ? ' ' + spec[2] : '') + (ui ? ' imgbtn ui-' + ui[0] : '');
  if (ui){
    el.textContent = ''; el.appendChild(uiImg(ui[1]));
    if (spec[4]){ const c = document.createElement('span'); c.className = 'cap'; c.textContent = spec[4]; el.appendChild(c); }
  } else if (spec[3]) el.innerHTML = spec[3]; else el.textContent = spec[0];
  el.setAttribute('aria-label', spec[0]);
  el.disabled = false;
  el.onclick = () => {
    const now = Date.now();
    if (now - lastAction < 300) return;
    lastAction = now;
    sfx('button', 1);
    spec[1]();
  };
}
function showOverlay(o){

  ovBig.textContent = o.big == null ? '' : o.big;
  ovBig.style.fontSize = o.bigSize || '';
  ovBig.hidden = o.big == null;
  ovText.textContent = o.text || '';
  ovText.className = o.record ? 'record' : '';
  ovText.hidden = !o.text;
  ovInput.hidden = !o.input;
  ovForm.innerHTML = ''; ovForm.hidden = !o.form; ov.classList.toggle('form', !!o.form); ov.classList.toggle('menu', !!o.menu); ov.scrollTop = 0;
  if (o.form) o.form(ovForm);

  if (o.list) o.list(ovList);
  setBtn(ovBtn, o.btn);

  setBtn(ovBtn6, o.btn6);
  setBtn(ovBtn3, o.btn3);

function showModes(){
  mode = 'menu';

    if (modeSel !== n || plSel !== k){
      modeSel = n; plSel = k;
      store.set('orbit-mode', String(n)); store.set('orbit-players', String(k));
      setOrbits(modeSel); newGame();
      sfx('button', 1, () => tone(660, .1, 'sine', .1));
    }
    ovList.innerHTML = ''; render(ovList);
  };
  const render = box => {
    box.className = 'list';
    for (const m of MODES){
      const on = m.n === modeSel;
      const card = document.createElement('div');
      card.className = 'card' + (on ? ' sel' : '');
      card.setAttribute('role', 'button'); card.tabIndex = 0;
      const t = document.createElement('b'); t.textContent = m.name;
      const d = document.createElement('span'); d.textContent = m.desc;
      const r = document.createElement('span'); r.textContent = 'Рекорд: ' + bests[m.n];
      const chips = document.createElement('div'); chips.className = 'chips';
      [1, 2, 3].forEach(k => {
        const c = document.createElement('button');
        c.className = 'chip' + (on && plSel === k ? ' on' : '');
        c.textContent = plLabel(k);
        c.onclick = e => { e.stopPropagation(); pick(m.n, k); };
        chips.appendChild(c);
      });
      card.append(t, d, r, chips);
      card.onclick = () => pick(m.n, plSel);
      card.onkeydown = e => { if (e.key === 'Enter') pick(m.n, plSel); };
      box.appendChild(card);

    title: 'Режимы', small: true,

function showRoad(){
  mode = 'menu';
  const render = box => {
    box.className = 'list road';
    const keep = box.scrollTop;
    const skins = SKINS.filter(k => !k.hidden && !k.gift);
    let prev = 0, firstLocked = true;
    skins.forEach(sk => {
      const open = glory >= sk.need;
      const node = document.createElement('div');
      node.className = 'node' + (open ? ' open' : '') + (open && sk.id === skinSel ? ' sel' : '');

      const im = new Image(); im.className = 'sk'; im.alt = ''; im.draggable = false; im.src = sk.file;
      im.onerror = () => {
        const ph = document.createElement('div'); ph.className = 'sk ph';
        ph.style.background = 'radial-gradient(circle at 35% 30%, #fff9, ' + sk.c + ' 62%)';
        im.replaceWith(ph);
      };
      const tx = document.createElement('div'); tx.className = 'tx';
      const nm = document.createElement('b'); nm.textContent = sk.name;
      const sub = document.createElement('span');
      tx.append(nm, sub);
      node.append(im, tx);

      if (open){
        sub.textContent = sk.need === 0 ? 'Открыт с самого начала' : 'Открыт';
        if (sk.id === skinSel){
          const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = 'Надет ✓';
          node.append(tag);
        }
        node.onclick = showInventory;
      } else {
        sub.textContent = 'Нужно очков славы: ' + sk.need;
        if (firstLocked){
          firstLocked = false;
          const bar = document.createElement('div'); bar.className = 'bar';
          const fill = document.createElement('i');
          fill.style.width = Math.max(4, Math.min(100, (glory - prev) / (sk.need - prev) * 100)) + '%';
          bar.appendChild(fill); tx.appendChild(bar);
          sub.textContent = 'Ещё ' + (sk.need - glory) + ' ' + plural(sk.need - glory, ['очко', 'очка', 'очков']) + ' славы';
        }
        node.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>');
      }
      prev = sk.need;
      box.appendChild(node);
    });
    box.scrollTop = keep;
  };
  showOverlay({
    title: 'Дорога славы', small: true,
    text: 'Очки славы: ' + glory + '\nНадеть открытый шар можно в Инвентаре.',
    list: render,
    btn2: ['Назад', showMenu],
    after: () => {
      const t = ovList.querySelector('.node:not(.open)');
      if (t) ovList.scrollTop = Math.max(0, t.offsetTop - ovList.clientHeight / 2 + t.offsetHeight / 2);
    }
  });
}

const withTimeout = (p, ms) => new Promise((res, rej) => {
  const t = setTimeout(() => rej(new Error('timeout')), ms);
  Promise.resolve(p).then(v => { clearTimeout(t); res(v); }, e => { clearTimeout(t); rej(e); });
});

/* Библиотека Supabase грузится НЕ блокируя страницу.
   Сначала локальный файл supabase.min.js (работает офлайн из кэша PWA), затем CDN. */
const SB_SOURCES = ['supabase.min.js', 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'];
const SB_LIB = (async () => {
  for (const src of SB_SOURCES){
    if (window.supabase) return true;
    const ok = await new Promise(res => {
      const s = document.createElement('script');
      const t = setTimeout(() => res(false), 5000);
      s.onload = () => { clearTimeout(t); res(!!window.supabase); };
      s.onerror = () => { clearTimeout(t); res(false); };
      s.src = src;
      document.head.appendChild(s);
    });
    if (ok) return true;
  }
  return !!window.supabase;
})();

function initSb(){
  if (sb) return sb;
  if (!netAvailable()) return null;
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: { params: { eventsPerSecond: 20 } } });
    NET.client = sb;
  } catch(e){ sb = null; }
  return sb;
}

function mkField(box, o){
  if (o.label){ const l = document.createElement('div'); l.className = 'flab'; l.textContent = o.label; box.appendChild(l); }
  const i = document.createElement('input');
  i.className = 'fld'; i.type = o.type || 'text'; i.placeholder = o.ph || '';
  i.maxLength = o.max || 60; i.value = o.val || '';
  i.autocomplete = o.ac || 'off'; i.spellcheck = false; i.autocapitalize = 'none';
  i.setAttribute('autocorrect', 'off'); i.setAttribute('aria-label', o.label || o.ph || '');
  i.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); ovBtn.click(); } });
  box.appendChild(i);
  return i;
}

async function syncProgress(){
  if (!sb || !user) return;
  try { await sb.rpc('save_progress', { p_glory: glory, p_best2: bests[2], p_best3: bests[3], p_skin: skinSel }); } catch(e){}
}
function resetProgress(){
  glory = 0; bests[2] = 0; bests[3] = 0; skinSel = 'standard';
  ['orbit-glory', 'orbit-best', 'orbit-best-3', 'orbit-skin', 'orbit-uid', 'orbit-profile'].forEach(k => { try { localStorage.removeItem(k); } catch(e){} });
}
function applyProfile(u, p){
  const cached = store.get('orbit-uid');
  const keep = !cached || cached === u.id;
  const localSkin = skinSel;
  glory    = keep ? Math.max(glory,   p.glory  | 0) : (p.glory  | 0);
  bests[2] = keep ? Math.max(bests[2], p.best_2 | 0) : (p.best_2 | 0);
  bests[3] = keep ? Math.max(bests[3], p.best_3 | 0) : (p.best_3 | 0);
  user = { id: u.id }; profile = p;
  skinSel = (cached === u.id || (!cached && localSkin !== 'standard')) ? localSkin : (p.skin || 'standard');
  if (!owns(skinSel)) skinSel = 'standard';
  store.set('orbit-uid', u.id); saveLocal();
  store.set('orbit-profile', JSON.stringify({ player_id: p.player_id, nickname: p.nickname, gifts: p.gifts || [] }));
  syncProgress();
}

async function enterAccount(u, isNew){
  const own = !Loader.on;
  if (own){ Loader.show('load', 'Загружаем профиль'); Loader.setBoot(0.25); }
  let p = null, failed = false;
  try {
    const r = await withTimeout(sb.from('profiles').select('*').eq('id', u.id).maybeSingle(), 8000);
    if (r.error) failed = true; else p = r.data;
  } catch(e){ failed = true; }
  Loader.setBoot(0.85);
  if (failed){
    showOverlay({ title: 'Нет соединения', text: 'Не удалось загрузить аккаунт.', btn: ['Повторить', () => enterAccount(u, isNew)], btn2: ['Войти офлайн', startOffline], btn3: ['Выйти из аккаунта', logout] });
    if (own) Loader.finish();
    return;
  }
  if (!p){
    showOverlay({ title: 'Профиль не найден', text: 'Для этого входа нет профиля игрока. Выйди и создай аккаунт заново.', btn: ['Выйти', logout] });

function showLogin(prefill){
  let fl, fp, hintEl, note, timer = 0, lastLogin = '';
  const loadHint = async () => {
    const l = fl.value.trim().toLowerCase();
    if (!LOGIN_RE.test(l) || l === lastLogin) return;
    lastLogin = l;
    try {
      const r = await sb.rpc('get_hint', { p_login: l });
      if (fl.value.trim().toLowerCase() !== l) return;
      setNote(hintEl, !r.error && r.data ? 'Подсказка к паролю:\n' + r.data : '');
    } catch(e){}
  };
  const doLogin = async () => {
    const l = fl.value.trim().toLowerCase(), p = fp.value;
    if (!LOGIN_RE.test(l) || !p){ setNote(note, 'Введи логин и пароль.'); return; }
    setNote(note, ''); busy(true, 'Входим…');
    try {
      const r = await withTimeout(sb.auth.signInWithPassword({ email: toEmail(l), password: p }), 15000);
      if (r.error){
        busy(false);
        setNote(note, /invalid|credentials/i.test(r.error.message) ? 'Неверный логин или пароль.' : 'Не получилось войти: ' + r.error.message);
        return;
      }
      await enterAccount(r.data.user, false);
    } catch(e){ busy(false); setNote(note, 'Нет соединения с сервером.'); }
  };
  showOverlay({
    title: 'Вход', small: true,
    form: box => {
      fl = mkField(box, { ph: 'Логин', ac: 'username', max: 20, val: prefill || '' });
      fp = mkField(box, { ph: 'Пароль', type: 'password', ac: 'current-password', max: 64 });
      hintEl = mkNote(box, '', 'warn');
      note = mkNote(box, '', 'err');
    },
    btn: ['Войти', doLogin],
    btn2: ['Войти офлайн', startOffline],
    btn3: ['Создать аккаунт', () => showReg1()],
    after: () => {
      fl.addEventListener('input', () => { clearTimeout(timer); lastLogin = ''; setNote(hintEl, ''); timer = setTimeout(loadHint, 500); });
      fl.addEventListener('blur', loadHint);
      if (prefill) loadHint();
    }
  });
}

const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genCode(){ let s = ''; for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }
function netAvailable(){
  return !!(window.supabase && /^https:\/\/[^\s]+\.supabase\.(co|in)/.test(SUPABASE_URL) && SUPABASE_KEY.length > 20);
}
const latestMeta = arr => { let b = null; for (const m of (arr || [])) if (m && (!b || (m.v | 0) >= (b.v | 0))) b = m; return b; };
const byJoin = (a, b) => (a.t - b.t) || (a.id < b.id ? -1 : 1);
const myNick = () => (profile && profile.nickname) || '';
const myPid = () => (profile && profile.player_id != null) ? String(profile.player_id) : '';
const shortName = s => { s = String(s || 'Игрок'); return s.length > 10 ? s.slice(0, 9) + '…' : s; };
function resetNetRoom(){
  opps = []; NET.order = null; NET.group = []; NET.info = {}; NET.seen = 0; NET.idx = 0;
  myRematch = false; overTextFn = null;
}
async function freshChannel(name, cfg){
  if (!NET.client) NET.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: { params: { eventsPerSecond: 20 } } });
  const topic = 'realtime:' + name;
  try {
    const old = NET.client.getChannels().filter(c => c.topic === topic);
    for (const c of old) await NET.client.removeChannel(c);
  } catch(e){}
  return NET.client.channel(name, cfg);
}

  audio();

  resetNetRoom();
  mmJoin();
}

async function mmJoin(){
  const tok = ++MM.token;
  clearTimeout(MM.pickT); clearTimeout(MM.commitT); MM.pickT = MM.commitT = 0;
  MM.lobby = ''; MM.members = []; MM.sig = ''; MM.committed = false;
  showLobby('Ищем игроков…', [], NET.need);
  let ch;
  try {
    ch = await freshChannel('orbit-mm:o' + NET.orb + 'p' + NET.need, { config: { presence: { key: NET.myId } } });
  } catch(e){ if (tok === MM.token) showNetError(); return; }
  if (tok !== MM.token || !multi || !NET.online) return;
  MM.ch = ch;
  ch.on('presence', { event: 'sync' }, () => { if (MM.ch === ch) mmSync(); })
    .subscribe(status => {
      if (MM.ch !== ch || !multi) return;
      if (status === 'SUBSCRIBED'){
        if (MM.lobby) mmTrack();
        else if (!MM.pickT) MM.pickT = setTimeout(mmPick, 800);
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){
        showNetError();
      }
    });
}
function mmMe(){ return { id: NET.myId, lb: MM.lobby, t: MM.t, n: myNick(), p: myPid(), k: skinSel }; }
function mmTrack(){ try { MM.ch.track(Object.assign(mmMe(), { v: ++MM.v })); } catch(e){} }
function mmLobbies(){
  const by = {};
  if (!MM.ch) return by;
  const st = MM.ch.presenceState();
  for (const k in st){
    const m = latestMeta(st[k]);
    if (!m || !m.id || !m.lb || m.id === NET.myId) continue;
    (by[m.lb] = by[m.lb] || []).push(m);
  }
  return by;
}
function mmPick(){
  MM.pickT = 0;
  if (!MM.ch || !multi || !NET.online || MM.committed) return;
  const by = mmLobbies(), need = NET.need;
  const firstT = l => Math.min.apply(null, l.map(m => m.t));
  const cands = Object.keys(by).filter(lb => by[lb].length < need)
    .sort((a, b) => (by[b].length - by[a].length) || (firstT(by[a]) - firstT(by[b])));
  MM.lobby = cands[0] || ('L' + Math.random().toString(36).slice(2, 10));
  MM.t = Date.now();
  mmTrack();
  mmSync();
}
function mmSync(){
  if (!MM.ch || !multi || !NET.online || MM.committed || !MM.lobby) return;
  const need = NET.need;
  const list = (mmLobbies()[MM.lobby] || []).concat(mmMe()).sort(byJoin);
  const idx = list.findIndex(p => p.id === NET.myId);
  if (idx >= need){
    MM.lobby = ''; MM.members = []; MM.sig = '';
    try { MM.ch.untrack(); } catch(e){}
    showLobby('Ищем игроков…', [], need);
    clearTimeout(MM.pickT); MM.pickT = setTimeout(mmPick, 250 + Math.random() * 450);
    return;
  }
  MM.members = list.slice(0, need);
  const sig = MM.members.map(m => m.id).join('|');
  if (sig !== MM.sig){ MM.sig = sig; showLobby('Игроков подключилось', MM.members, need); }
  if (MM.members.length >= need){
    if (!MM.commitT) MM.commitT = setTimeout(mmCommit, 650);
  } else if (MM.commitT){ clearTimeout(MM.commitT); MM.commitT = 0; }
}
function mmCommit(){
  MM.commitT = 0;
  if (!MM.ch || !multi || !NET.online || MM.committed || !MM.lobby) return;
  const need = NET.need;
  const list = (mmLobbies()[MM.lobby] || []).concat(mmMe()).sort(byJoin);
  const idx = list.findIndex(p => p.id === NET.myId);
  if (idx < 0 || idx >= need || list.length < need){ mmSync(); return; }
  MM.committed = true;
  MM.members = list.slice(0, need);
  MM.drop = MM.ch; MM.ch = null;
  clearTimeout(MM.dropT); MM.dropT = setTimeout(mmDrop, 2000);
  NET.code = MM.lobby;
  showLobby('Игра найдена! Подключаемся…', MM.members, need);
  connect(NET.code);
  clearTimeout(NET.joinT);
  NET.joinT = setTimeout(() => { if (multi && NET.online && !NET.order) restartMatchmaking(); }, 14000);
}
function mmDrop(){
  MM.dropT = 0;
  const d = MM.drop; MM.drop = null;
  if (d){ try { d.untrack(); NET.client.removeChannel(d); } catch(e){} }
}
function mmStop(){
  MM.token++;
  clearTimeout(MM.pickT); clearTimeout(MM.commitT); clearTimeout(MM.dropT);
  MM.pickT = MM.commitT = MM.dropT = 0;
  const a = MM.ch, b = MM.drop;
  MM.ch = null; MM.drop = null; MM.lobby = ''; MM.members = []; MM.sig = ''; MM.committed = false;
  [a, b].forEach(c => { if (c){ try { c.untrack(); NET.client.removeChannel(c); } catch(e){} } });
}
function restartMatchmaking(){
  if (!multi || !NET.online) return;
  NET.token++;
  clearTimeout(NET.startT); NET.startT = 0; clearTimeout(NET.joinT); NET.joinT = 0;
  try { if (NET.ch){ NET.ch.untrack(); NET.client.removeChannel(NET.ch); } } catch(e){}
  NET.ch = null; NET.code = '';
  clearInterval(NET.pingT); NET.pingT = 0; NET.off = null; NET.offRtt = Infinity;
  resetNetRoom();
  mmStop();
  mmJoin();
}

async function connect(code){
  const tok = ++NET.token;
  try {
    const ch = await freshChannel('orbit:' + code, { config: { broadcast: { self: false }, presence: { key: NET.myId } } });
    if (tok !== NET.token || !multi) return;
    NET.ch = ch;
    ch.on('broadcast', { event: 'start' },   m => onStart(m.payload))
      .on('broadcast', { event: 'state' },   m => onOppState(m.payload))
      .on('broadcast', { event: 'rematch' }, m => onRematch(m.payload))
      .on('broadcast', { event: 'ping' },    m => {
        if (NET.host && NET.ch === ch && m.payload){ try { ch.send({ type: 'broadcast', event: 'pong', payload: { c: m.payload.c, r: m.payload.r, h: Date.now() } }); } catch(e){} }
      })
      .on('broadcast', { event: 'pong' },    m => onPong(m.payload))
      .on('presence',  { event: 'sync' },    onPresence)
      .subscribe(status => {
        if (!multi || NET.ch !== ch) return;
        if (status === 'SUBSCRIBED'){
          ch.track({ id: NET.myId, t: Date.now(), k: skinSel, n: myNick(), p: myPid(), pc: NET.online ? NET.need : netPlayers() });
          if (mode === 'lobby' && !NET.online && !NET.order) showWaiting('Ждём игроков. Отправь код или ссылку.');
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){
          showNetError();
        }
      });
  } catch(e){ if (tok === NET.token) showNetError(); }
}
function showNetError(){
  leaveRoom(true);
  showOverlay({
    title: 'Нет соединения',
    text: 'Не удалось подключиться к серверу. Проверьте интернет и настройки Supabase.',
    btn: ['Назад', showMenu]
  });
}
function leaveRoom(silent){
  multi = false; match.active = false;
  NET.token++;
  mmStop();
  clearTimeout(NET.startT); NET.startT = 0; clearTimeout(NET.joinT); NET.joinT = 0;
  try { if (NET.ch && NET.client){ NET.ch.untrack(); NET.client.removeChannel(NET.ch); } } catch(e){}
  NET.ch = null; NET.code = ''; NET.online = false;
  clearInterval(NET.pingT); NET.pingT = 0; NET.off = null; NET.offRtt = Infinity;
  resetNetRoom();

  try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch(e){}

  setOrbits(modeSel);

}

function onPresence(){
  if (!multi || !NET.ch) return;
  const st = NET.ch.presenceState(), list = [];
  for (const k in st){ const m = latestMeta(st[k]); if (m && m.id) list.push(m); }
  list.sort(byJoin);
  const idx = list.findIndex(p => p.id === NET.myId);
  if (idx < 0) return;
  let group;
  if (NET.order){
    group = list.filter(p => NET.order.indexOf(p.id) >= 0);
  } else {
    if (!NET.online) NET.need = list[0].pc === 3 ? 3 : 2;
    if (idx >= NET.need){
      if (NET.online){ restartMatchmaking(); return; }
      leaveRoom(true);
      showOverlay({ title: 'Комната занята', text: 'В этой комнате уже все места заняты.', btn: ['Назад', showMenu] });
      return;
    }
    group = list.slice(0, NET.need);
    NET.host = idx === 0;
  }
  NET.info = {};
  for (const p of group) NET.info[p.id] = p;

  if (NET.order){
    for (const o of opps){
      const p = NET.info[o.id], was = o.present;
      o.present = !!p;
      if (p){ o.skin = skinOk(p.k) ? p.k : 'standard'; o.name = p.n ? String(p.n).slice(0, 20) : o.name; o.pid = p.p ? String(p.p) : o.pid; }
      if (was && !o.present) playerLeft(o);
    }
    return;
  }

  NET.group = group;
  NET.seen = Math.max(NET.seen, group.length);
  if (group.length > 1 && !NET.host) ensurePings();
  const full = group.length >= NET.need;
  if (NET.online){
    if (mode === 'lobby' && NET.seen >= NET.need && !full){ restartMatchmaking(); return; }
  } else if (mode === 'lobby'){
    showWaiting(full ? 'Все на связи! Начинаем…'
      : group.length > 1 ? 'Подключились: ' + group.length + '/' + NET.need + '. Ждём остальных.'
      : 'Ждём игроков (1/' + NET.need + '). Отправь код или ссылку.');
  }
  if (full && NET.host && mode === 'lobby' && !NET.startT){
    NET.startT = setTimeout(() => {
      NET.startT = 0;
      if (multi && mode === 'lobby' && !NET.order && NET.group.length >= NET.need) hostStart();
    }, 900);
  } else if (!full && NET.startT){ clearTimeout(NET.startT); NET.startT = 0; }
}
function playerLeft(o){
  o.left = true;
  if (mode === 'over'){ lockRematch(); if (overTextFn) ovText.textContent = overTextFn(); return; }
  evaluate();
}

function hostStart(){
  if (!NET.ch || !multi) return;
  const order = NET.order ? NET.order.slice() : NET.group.slice(0, NET.need).map(p => p.id);
  if (order.length < 2) return;
  const seed = (Math.random() * 2147483647) >>> 0;
  const at = Date.now() + 3200;
  const pl = { seed, orbits: NET.online ? NET.orb : modeSel, at, order };
  NET.ch.send({ type: 'broadcast', event: 'start', payload: pl });
  onStart(pl);
}
function buildOpps(){
  const n = NET.order.length;
  opps = [];
  NET.order.forEach((id, i) => {
    if (id === NET.myId) return;
    const p = NET.info[id] || {}, lane = startLane(i, n);
    opps.push({
      id, idx: i, off: i * TAU / n, present: true, left: false, lane, r: R[lane], score: 0, dead: false, rematch: false,
      skin: skinOk(p.k) ? p.k : 'standard', name: p.n ? String(p.n).slice(0, 20) : '', pid: p.p ? String(p.p) : '', trail: []
    });
  });
}
function onStart(p){
  if (!multi || !p || !Array.isArray(p.order)) return;
  const idx = p.order.indexOf(NET.myId);
  if (idx < 0) return;
  audio();
  clearTimeout(NET.joinT); NET.joinT = 0; clearTimeout(NET.startT); NET.startT = 0;
  NET.order = p.order.slice(0, 3); NET.idx = idx; NET.host = idx === 0;
  setOrbits(p.orbits === 3 ? 3 : 2);
  buildOpps();
  myRematch = false; overTextFn = null;
  NET.sentS = 0; NET.sendT = 0;
  match.active = true;
  const np = NET.order.length;
  newGame(p.seed >>> 0, startLane(idx, np), idx, np);
  match.hostAt = p.at || 0;
  match.startLocal = NET.host ? (p.at || Date.now() + 3200) : startOnMyClock();
  mode = 'count'; cd = (match.startLocal - Date.now()) / 1000;
  hideOverlay();
  pauseBtn.style.display = 'none';
  bestHud.style.display = 'block';
}
function startOnMyClock(){
  if (match.hostAt && NET.off != null) return match.hostAt - NET.off;
  return Date.now() + 3200 - 100;
}
function onPong(p){
  if (!p || NET.host || p.r !== NET.myId) return;
  const t1 = Date.now(), rtt = t1 - p.c;
  if (!(rtt >= 0 && rtt < 3000) || rtt >= NET.offRtt) return;
  NET.offRtt = rtt; NET.off = p.h + rtt / 2 - t1;
}
function ensurePings(){
  if (NET.pingT || NET.host || !multi) return;
  let n = 0;
  const send = () => {
    if (!multi || !NET.ch || NET.host){ clearInterval(NET.pingT); NET.pingT = 0; return; }
    if (mode === 'play' || mode === 'dying') return;
    try { NET.ch.send({ type: 'broadcast', event: 'ping', payload: { c: Date.now(), r: NET.myId } }); } catch(e){}
    if (++n === 10){ clearInterval(NET.pingT); NET.pingT = setInterval(send, 2000); }
  };
  send();
  NET.pingT = setInterval(send, 150);
}
function onOppState(p){
  if (!multi || !p) return;
  const o = opps.find(x => x.id === p.i);
  if (!o) return;
  o.lane = Math.max(0, Math.min(ORB - 1, p.l | 0));
  o.score = p.s | 0;
  const wasDead = o.dead;
  o.dead = !!p.d;
  if (o.dead && !wasDead && match.active && (mode === 'play' || mode === 'count' || mode === 'dying')){
    const gp = pos(oppAngle(o), o.r);
    burst(gp[0], gp[1], skinById(oppSkinId(o)).c, 44, S * 0.9, S * 0.016);
    burst(gp[0], gp[1], '#ff3d6e', 18, S * 0.6, S * 0.012);
    sfx('defeat', .5, () => tone(200, .5, 'sawtooth', .1, 50)); buzz([20, 20, 40]);
  }
  if (mode === 'wait') updateWait();
  else if (mode === 'over' && overTextFn) ovText.textContent = overTextFn();
  evaluate();
}
function netSend(force){
  if (!multi || !NET.ch || !G) return;
  const now = Date.now();
  if (!force && now - NET.lastSend < 70) return;
  NET.lastSend = now; NET.sentS = G.score;
  try { NET.ch.send({ type: 'broadcast', event: 'state', payload: { i: NET.myId, l: G.lane, s: G.score, d: G.dead ? 1 : 0 } }); } catch(e){}
}

function standText(){
  const rows = [{ me: true, name: 'Ты', score: G.score }];
  for (const o of opps) rows.push({ name: shortName(o.name || 'Игрок'), score: o.score, left: o.left });
  rows.sort((a, b) => ((a.left ? 1 : 0) - (b.left ? 1 : 0)) || (b.score - a.score));
  return rows.map((r, i) => (i + 1) + '. ' + r.name + ' — ' + r.score + (r.left ? ' (вышел)' : '')).join('\n');
}
function evaluate(){
  if (!multi || !match.active) return;
  const me = G;
  const rk = opps.filter(o => !o.left);
  if (!rk.length){ endMatch('win', '\n(все соперники вышли)'); return; }
  const alive = rk.filter(o => !o.dead);
  const top = Math.max.apply(null, rk.map(o => o.score));
  if (!me.dead){
    if (!alive.length && me.score > top) endMatch('win');
  } else if (mode === 'wait'){
    if (!alive.length) endMatch(me.score > top ? 'win' : me.score < top ? 'lose' : 'draw');
    else if (top > me.score) endMatch('lose');
  }

function updateWait(){

}
function afterDeath(){

  updateWait();
  evaluate();
}
function endMatch(result, note){
  if (!match.active) return;
  match.active = false;
  if (!G.banked) bankScore();
  netSend(true);
  mode = 'over';
  pauseBtn.style.display = 'none'; bestHud.style.display = 'none';
  if (result === 'win'){ burst(cx, cy, '#ffd23f', 60, S * 0.9, S * 0.014); sfx('coins', 1, () => tone(784, .25, 'triangle', .14)); buzz([30, 40, 30]); }
  const gl = gloryText();
  overTextFn = () => standText() + (note || '') + gl;
  showOverlay({
    title: result === 'win' ? 'Победа!' : result === 'lose' ? 'Поражение' : 'Ничья',
    big: G.score,
    text: overTextFn(),
    record: result === 'win',
    btn: ['Реванш', requestRematch],
    btn3: ['Выйти', () => leaveRoom()]
  });
  if (opps.some(o => o.left || !o.present)) lockRematch();
  pendingUnlocks = [];
}
function lockRematch(){ ovBtn.disabled = true; ovBtn.textContent = 'Игрок вышел'; }
function requestRematch(){
  myRematch = true;
  ovBtn.disabled = true; ovBtn.textContent = opps.length > 1 ? 'Ждём остальных…' : 'Ждём соперника…';
  try { NET.ch && NET.ch.send({ type: 'broadcast', event: 'rematch', payload: { i: NET.myId } }); } catch(e){}
  checkRematch();
}
function onRematch(p){
  const o = p && opps.find(x => x.id === p.i);
  if (o){ o.rematch = true; checkRematch(); }
}
function checkRematch(){
  if (multi && myRematch && NET.host && opps.length && opps.every(o => o.present && !o.left && o.rematch)) hostStart();
}

function tap(dir, target){
  if (mode !== 'play' || G.dead) return;
  let nl;
  if (ORB === 2) nl = G.lane ^ 1;
  else if (target != null) nl = target;
  else nl = Math.max(0, Math.min(ORB - 1, G.lane + (dir || 1)));
  G.taps++;
  if (nl === G.lane) return;
  const out = nl > G.lane;
  G.lane = nl; G.squash = 1; G.pulse = { lane: nl, t: 0 };
  sfx('click', 1, () => { if (out) tone(330, .09, 'triangle', .1, 220); else tone(494, .09, 'triangle', .1, 740); });
  buzz(8);
  netSend(true);
}

function laneAt(x, y){
  const d = Math.hypot(x - cx, y - cy);
  let best = 0;
  for (let i = 1; i < ORB; i++) if (Math.abs(d - R[i]) < Math.abs(d - R[best])) best = i;
  return best;
}

/* ---------- Цикл ---------- */
let last = 0, lastHud = '';
function frame(ts){
  const real = Math.min(0.1, (ts - last) / 1000 || 0.016);
  last = ts;
  musicTick(real);
  Loader.tick(real);

  if (mode === 'play'){
    let n = 0;
    if (multi){
      const target = Math.max(0, Math.floor((Date.now() - match.startLocal) / (STEP * 1000)));
      while (G.stepN < target && n < 10){
        update(STEP); G.stepN++; n++;
        if (mode !== 'play') break;
      }
    } else {
      acc += real;
      while (acc >= STEP && n < 6){
        update(STEP); acc -= STEP; n++;
        if (mode !== 'play') break;
      }
      if (n >= 6) acc = 0;
    }
    if (multi && mode === 'play'){
      NET.sendT += real;
      if (G.score !== NET.sentS || NET.sendT >= 1){ NET.sendT = 0; netSend(true); }
      evaluate();
    }
  } else if (mode === 'menu' || mode === 'lobby'){
    idle(real);
  } else if (mode === 'count'){
    if (multi){
      if (!NET.host && match.hostAt && NET.off != null) match.startLocal = match.hostAt - NET.off;
      cd = (match.startLocal - Date.now()) / 1000;
    } else cd -= real;
    if (cd <= 0){ mode = 'play'; acc = 0; NET.sendT = 0; }
  } else if (mode === 'dying'){
    fxUpdate(real);
    G.deadT += real;
    if (G.deadT > 0.85) afterDeath();
  } else if (mode === 'over' || mode === 'wait'){
    fxUpdate(real);
  }

  if (multi && (mode === 'count' || mode === 'play' || mode === 'dying')){
    const t = opps.map(o => shortName(o.name || 'Соперник') + ': ' + o.score + (o.left ? ' (вышел)' : o.dead ? ' (вылетел)' : '')).join('\n');
    if (t !== lastHud){ lastHud = t; bestHud.textContent = t; }
  }

  const wantArrows = ORB === 3 && (mode === 'play' || mode === 'count');
  if (arrows.hidden === wantArrows) arrows.hidden = !wantArrows;
  const wantAcc = (!!user || offline) && mode === 'menu' && !multi;
  if (accBtn.hidden === wantAcc) accBtn.hidden = !wantAcc;

  bgRot = G.world * 0.5 + ts * 0.00003;
  draw();
  requestAnimationFrame(frame);
}

    const sz = 1 + Math.random() * 2.5;
    p.style.width = p.style.height = sz + 'px';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.animationDuration = (8 + Math.random() * 10) + 's';
    p.style.animationDelay = (-Math.random() * 18) + 's';
    const col = Math.random() > .5 ? '#6ea8ff' : '#a855f7';
    p.style.background = col;
    p.style.boxShadow = '0 0 8px ' + col;
    document.body.appendChild(p);
  }
})();

const hash = (location.hash || '').slice(1).toUpperCase();
if (/^[A-HJ-NP-Z2-9]{4}$/.test(hash)) pendingRoom = hash;
startApp();
})();
</script>
