<script>

'use strict';

/* ---------- Утилиты ---------- */
const TAU = Math.PI * 2;
const STEP = 1 / 60;                       // фиксированный шаг симуляции: у обоих игроков одинаковый мир
const FONT = 'ui-rounded, "SF Pro Rounded", Nunito, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif';

function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rng = Math.random;                      // в гонке заменяется генератором с общим seed

const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },

  3: parseInt(store.get('orbit-best-3') || '0', 10) || 0
};
const bestKey = n => n === 3 ? 'orbit-best-3' : 'orbit-best';

let newRecord = false;

/* ---------- Режимы ---------- */
const MODES = [
  { n: 2, name: 'Классика (2 орбиты)', desc: 'Две орбиты. Коснись экрана — перепрыгнешь на другую.' },
  { n: 3, name: 'Классика (3 орбиты)', desc: 'Три орбиты. Тап слева — ближе к центру, тап справа — дальше от него.' }
];
let modeSel = store.get('orbit-mode') === '3' ? 3 : 2;   // выбранный режим
let ORB = modeSel;                                        // сколько орбит в текущей игре (в мультиплеере задаёт хозяин комнаты)
const modeName = n => (MODES.find(m => m.n === n) || MODES[0]).name;

/* ---------- Скины и «Дорога славы» ----------
   Картинки лежат в папке skins/. Чтобы поменять имя, цену или цвет — правьте этот список.

const SKINS = [
  { id: 'standard',   name: 'Стандарт',        file: 'skins/standard.png',   need: 0,   c: '#ffd23f' },
  { id: '1000347066', name: 'Янтарь',          file: 'skins/1000347066.png', need: 25,  c: '#ffb21f', crop: [150, 175, 1105, 1098] },
  { id: '1000347065', name: 'Океан',           file: 'skins/1000347065.png', need: 70,  c: '#3d8bff', crop: [154, 167, 1099, 1091] },
  { id: '1000347067', name: 'Сырная луна',     file: 'skins/1000347067.png', need: 140, c: '#ffc21a', crop: [194, 228, 1061, 1084] },
  { id: '1000347052', name: 'Ледяная луна',    file: 'skins/1000347052.png', need: 240, c: '#3fd6ff', crop: [232, 233, 1019, 1016] },
  { id: '1000347056', name: 'Красная планета', file: 'skins/1000347056.png', need: 380, c: '#ff5a2e', crop: [193, 232, 1063, 1082] },
  { id: '1000347070', name: 'Токсик',          file: 'skins/1000347070.png', need: 560, c: '#9dff2a', crop: [152, 169, 1104, 1096] },
  { id: '1000347073', name: 'Лава-кот',        file: 'skins/1000347073.png', need: 800, c: '#ff9a1f', crop: [169, 159, 1087, 1097] },
  // шар друга в игре с другом (если у друга стандартный скин); в дороге славы не показывается
  { id: 'standard-2', name: 'Стандарт 2',      file: 'skins/standard-2.png', need: 0,   c: '#9ec5ff', hidden: true }
];
const skinById = id => SKINS.find(k => k.id === id) || SKINS[0];
const skinOk = id => SKINS.some(k => k.id === id && !k.hidden);
let glory = parseInt(store.get('orbit-glory') || '0', 10) || 0;     // очки славы
let skinSel = store.get('orbit-skin') || 'standard';
if (!skinOk(skinSel) || glory < skinById(skinSel).need) skinSel = 'standard';
let pendingUnlocks = [];                                             // скины, открытые в последней игре
const plural = (n, f) => { const a = Math.abs(n) % 100, b = a % 10; return a > 10 && a < 20 ? f[2] : b > 1 && b < 5 ? f[1] : b === 1 ? f[0] : f[2]; };

// картинки скинов: обрезаем по границе планеты и заранее уменьшаем — так они рисуются быстро и без «лесенки»
const skinCanvas = {};
function alphaBox(im){
  try {
    const n = 256, c = document.createElement('canvas'); c.width = c.height = n;
    const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(im, 0, 0, n, n);
    const d = x.getImageData(0, 0, n, n).data;
    let x0 = n, y0 = n, x1 = -1, y1 = -1;
    for (let y = 0; y < n; y++) for (let xx = 0; xx < n; xx++){
      if (d[(y * n + xx) * 4 + 3] > 128){ if (xx < x0) x0 = xx; if (xx > x1) x1 = xx; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    if (x1 < x0 || y1 < y0) return null;
    const fx = im.naturalWidth / n, fy = im.naturalHeight / n;
    return [x0 * fx, y0 * fy, (x1 + 1) * fx, (y1 + 1) * fy];
  } catch(e){ return null; }                // например, страница открыта как file:// — тогда берём рамку из списка
}
function prepSkin(im, sk){
  const k = im.naturalWidth / 1254;
  let box = alphaBox(im);
  if (!box && sk.crop) box = sk.crop.map(v => v * k);
  if (!box) box = [0, 0, im.naturalWidth, im.naturalHeight];
  const sx = box[0], sy = box[1], sw = box[2] - box[0], sh = box[3] - box[1];
  const T = 192, m = Math.max(sw, sh);
  const w = Math.max(1, Math.round(T * sw / m)), h = Math.max(1, Math.round(T * sh / m));
  let src = im, a = sx, b = sy, c = sw, d = sh;
  if (m > T * 2){
    const mid = document.createElement('canvas'), f = (T * 2) / m;
    mid.width = Math.round(sw * f); mid.height = Math.round(sh * f);
    const mc = mid.getContext('2d'); mc.imageSmoothingQuality = 'high';
    mc.drawImage(im, sx, sy, sw, sh, 0, 0, mid.width, mid.height);
    src = mid; a = 0; b = 0; c = mid.width; d = mid.height;
  }
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const oc = out.getContext('2d'); oc.imageSmoothingQuality = 'high';
  oc.drawImage(src, a, b, c, d, 0, 0, w, h);
  return out;
}
function loadSkins(){
  for (const sk of SKINS){
    const im = new Image();
    im.onload = () => { try { skinCanvas[sk.id] = prepSkin(im, sk); } catch(e){} };
    im.src = sk.file;                        // нет файла — просто рисуем цветной шар
  }
}

/* ---------- Звук и вибрация ---------- */
let ac = null;
function audio(){
  if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (ac && ac.state === 'suspended') ac.resume();

}
function tone(freq, dur, type, vol, slideTo){
  if (muted) return;
  const a = audio(); if (!a) return;
  const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol || .1, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur + .03);
}
const NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
function buzz(p){ if (!muted && navigator.vibrate){ try { navigator.vibrate(p); } catch(e){} } }

/* ---------- Размеры ---------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, S = 0, cx = 0, cy = 0, dpr = 1, R = [0, 0], BAND = 0, PR = 0;
let G = null;
const pos = (a, r) => [cx + Math.sin(a) * r, cy - Math.cos(a) * r];
function radii(n){ return n === 3 ? [S * 0.25, S * 0.33, S * 0.41] : [S * 0.25, S * 0.41]; }
function setOrbits(n){
  ORB = n === 3 ? 3 : 2; R = radii(ORB);
  if (G){ G.lane = Math.min(G.lane, ORB - 1); G.r = R[G.lane]; }

}

  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(W, H * 0.92);

}

/* ---------- Состояние ---------- */
// menu | lobby | count | play | pause | dying | wait | over
let mode = 'menu';
let bgRot = 0, acc = 0, cd = 0;
const dust = Array.from({ length: 56 }, () => ({

}));

// сетевое состояние
let multi = false;
const NET = { client: null, ch: null, code: '', host: false, myId: Math.random().toString(36).slice(2, 10), lastSend: 0, sendT: 0 };
const match = { active: false };
const opp = { present: false, lane: 1, r: 0, score: 0, dead: false, rematch: false, skin: 'standard' };
let myRematch = false;

function newGame(seed, lane){
  rng = (seed == null) ? Math.random : mulberry32(seed);
  if (lane == null) lane = 1;                // одиночная игра: внешняя орбита (в 3 орбитах — средняя)
  const p = pos(0, R[lane]);
  G = {

    speed: 2.0, world: 0, ow: 0,
    obs: [], stars: [], parts: [], pops: [], trail: [],
    score: 0, combo: 0, comboT: 0, scorePulse: 0, squash: 0,

    dead: false, deadT: 0, taps: 0, lastFlip: 0
  };
}

/* ---------- Эффекты ---------- */
function burst(x, y, color, n, speed, size){
  for (let i = 0; i < n; i++){
    const a = Math.random() * TAU, v = speed * (0.25 + Math.random() * 0.75);
    const life = 0.45 + Math.random() * 0.5;
    G.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life, max: life, c: color, s: size * (0.5 + Math.random()) });
  }
  if (G.parts.length > 240) G.parts.splice(0, G.parts.length - 240);
}
function fxUpdate(dt){
  const g = G, damp = Math.pow(0.04, dt);
  for (let i = g.parts.length - 1; i >= 0; i--){
    const p = g.parts[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= damp; p.vy *= damp; p.life -= dt;
    if (p.life <= 0) g.parts.splice(i, 1);
  }
  for (let i = g.pops.length - 1; i >= 0; i--){
    const p = g.pops[i]; p.t += dt; if (p.t > 0.7) g.pops.splice(i, 1);
  }
  g.shake = Math.max(0, g.shake - dt * 40);
  g.flash = Math.max(0, g.flash - dt * 3);
  g.scorePulse = Math.max(0, g.scorePulse - dt * 5);
  g.squash = Math.max(0, g.squash - dt * 6);
}

/* ---------- Спавн (всё через rng и только от времени — одинаково у обоих игроков) ---------- */
function spawnObs(){
  const g = G;
  if (g.obs.length >= (ORB === 3 ? 10 : 7)) return;
  const half = 0.28 + rng() * 0.32 + Math.min(0.25, g.t * 0.004);
  const gap = Math.max(0.75, 1.1 - g.t * 0.004);
  for (let k = 0; k < 8; k++){
    const lane = Math.floor(rng() * ORB);
    const a = g.angle - g.world + 2.2 + rng() * 2.2;
    let ok = true;
    for (const o of g.obs){
      if (Math.abs(angDiff(a, o.a)) < half + o.half + (o.lane === lane ? 0.25 : gap)){ ok = false; break; }
    }
    if (ok) for (const s of g.stars){
      if (s.lane === lane && Math.abs(angDiff(a, s.a)) < half + 0.3){ ok = false; break; }
    }
    if (ok){
      g.obs.push({ lane, a, half, age: 0, warn: 0.85, life: 3.2 + rng() * 1.6, live: false });
      return;
    }
  }
}
function spawnStars(){
  const g = G, lane = Math.floor(rng() * ORB);
  const count = rng() < 0.55 ? 3 : 1;
  const a0 = g.angle - g.world + 1.4 + rng() * 1.8;
  for (let i = 0; i < count; i++){
    const a = a0 + i * 0.34;
    let ok = true;
    for (const o of g.obs){
      if (o.lane === lane && Math.abs(angDiff(a, o.a)) < o.half + 0.3){ ok = false; break; }
    }
    if (ok) g.stars.push({ lane, a, age: 0, life: 6, taken: false });
  }
}

/* ---------- Логика ---------- */
// попадание корабля в дугу (учитывает орбиту)
function overlaps(o){
  const g = G, r = R[o.lane];
  if (Math.abs(g.r - r) > BAND * 0.5 + PR * 0.7) return false;
  const tol = o.half + (BAND * 0.5) / r + (PR * 0.75) / Math.max(g.r, 1);
  return Math.abs(angDiff(g.angle, o.a + g.world)) < tol;
}
// «корабль на линии дуги» без учёта орбиты — зависит только от времени, поэтому одинаково у всех
function inArc(o, pad){
  const tol = o.half + (BAND * 0.5) / R[o.lane] + (PR * 0.75) / R[0] + pad;
  return Math.abs(angDiff(G.angle, o.a + G.world)) < tol;
}

function update(dt){
  const g = G;
  g.t += dt;
  g.speed = 2.0 + Math.min(1.4, g.t * 0.016);
  g.ow = 0.85 * Math.sin(g.t * 0.4) * Math.min(1, g.t / 12);
  g.world += g.ow * dt;
  g.angle += g.speed * dt;
  g.r += (R[g.lane] - g.r) * Math.min(1, dt * 14);
  const p = pos(g.angle, g.r);
  g.px = p[0]; g.py = p[1];
  g.trail.push([g.px, g.py]); if (g.trail.length > 16) g.trail.shift();
  if (multi) opp.r += (R[opp.lane] - opp.r) * Math.min(1, dt * 14);

  g.nextObs -= dt;
  if (g.nextObs <= 0){
    spawnObs();
    g.nextObs = Math.max(0.55, 1.6 - g.t * 0.014) * (0.75 + rng() * 0.5) * (ORB === 3 ? 0.8 : 1);
  }
  g.nextStar -= dt;
  if (g.nextStar <= 0 && g.stars.length <= 3){
    spawnStars();
    g.nextStar = 1.3 + rng() * 0.8;
  }

  for (let i = g.obs.length - 1; i >= 0; i--){
    const o = g.obs[i];
    o.age += dt;
    if (!o.live && o.age >= o.warn){
      if (inArc(o, 0.3)) o.age = o.warn - 0.001; else o.live = true;
    }
    const end = o.warn + o.life;
    if (o.live && o.age < end && overlaps(o)){ die(); return; }
    if (o.age > end + 0.3) g.obs.splice(i, 1);
  }

  for (let i = g.stars.length - 1; i >= 0; i--){
    const s = g.stars[i];
    s.age += dt;
    if (!s.taken){
      const sp = pos(s.a + g.world, R[s.lane]);
      if (Math.hypot(sp[0] - g.px, sp[1] - g.py) < PR * 2.0){
        s.taken = true;
        g.combo = g.comboT > 0 ? Math.min(5, g.combo + 1) : 1;
        g.comboT = 2.4;
        g.score += g.combo;
        g.scorePulse = 1;
        burst(sp[0], sp[1], '#5cf2c0', 14, S * 0.5, S * 0.012);
        g.pops.push({ x: sp[0], y: sp[1] - PR, t: 0, text: '+' + g.combo });
        tone(NOTES[g.combo], .16, 'sine', .14);
        tone(NOTES[g.combo] * 2, .1, 'triangle', .04);
        buzz(10);
      }
    }
    if (s.age > s.life) g.stars.splice(i, 1);   // звезда живёт ровно life секунд, даже если её забрали
  }

  if (g.comboT > 0){ g.comboT -= dt; if (g.comboT <= 0) g.combo = 0; }
  fxUpdate(dt);
}

function idle(dt){
  const g = G;
  g.t += dt; g.angle += 1.1 * dt; g.world += 0.12 * dt;
  const f = Math.floor(g.t / 1.8);
  if (f !== g.lastFlip){ g.lastFlip = f; const seq = ORB === 3 ? [2, 1, 0, 1] : [1, 0]; g.lane = seq[((f % seq.length) + seq.length) % seq.length]; }
  g.r += (R[g.lane] - g.r) * Math.min(1, dt * 6);
  const p = pos(g.angle, g.r); g.px = p[0]; g.py = p[1];
  g.trail.push([g.px, g.py]); if (g.trail.length > 16) g.trail.shift();
  fxUpdate(dt);
}

function die(){
  const g = G;
  g.dead = true; g.deadT = 0; mode = 'dying';
  g.shake = 16; g.flash = 1;
  burst(g.px, g.py, skinById(skinSel).c, 46, S * 0.9, S * 0.016);
  burst(g.px, g.py, '#ff3d6e', 20, S * 0.6, S * 0.012);
  tone(260, .55, 'sawtooth', .16, 45);
  buzz([40, 30, 80]);
  newRecord = g.score > bests[ORB];
  if (newRecord){ bests[ORB] = g.score; store.set(bestKey(ORB), String(g.score)); }
  const before = glory;                                   // очки славы = набранные очки
  glory += g.score; store.set('orbit-glory', String(glory));
  pendingUnlocks = SKINS.filter(k => !k.hidden && k.need > before && k.need <= glory);
  pauseBtn.style.display = 'none';
  netSend(true);
}

/* ---------- Рисование ---------- */
function starPath(x, y, r, rot){
  ctx.beginPath();
  for (let i = 0; i < 10; i++){
    const rr = i % 2 ? r * 0.45 : r, a = rot + i * Math.PI / 5;
    const px = x + Math.sin(a) * rr, py = y - Math.cos(a) * rr;
    i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
  }
  ctx.closePath();
}
function arcAt(r, center, half){
  ctx.beginPath();
  ctx.arc(cx, cy, r, center - half, center + half);
}

// шар со скином (если картинки нет — просто цветной шар)
function drawBall(x, y, id, pr, alpha){
  const sk = skinById(id), im = skinCanvas[id];
  ctx.save();
  ctx.globalAlpha = alpha * 0.22; ctx.fillStyle = sk.c;
  ctx.beginPath(); ctx.arc(x, y, pr * 1.8, 0, TAU); ctx.fill();
  ctx.globalAlpha = alpha;
  if (im){
    const k = pr * 2 / Math.max(im.width, im.height), w = im.width * k, h = im.height * k;
    ctx.drawImage(im, x - w / 2, y - h / 2, w, h);
  } else {
    const rr = pr * 0.78;
    ctx.fillStyle = sk.c;
    ctx.beginPath(); ctx.arc(x, y, rr, 0, TAU); ctx.fill();
    ctx.globalAlpha = alpha * 0.55; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x - rr * 0.25, y - rr * 0.25, rr * 0.42, 0, TAU); ctx.fill();
  }
  ctx.restore();
}

function drawObstacle(o){
  const g = G, r = R[o.lane], ca = o.a + g.world - Math.PI / 2, end = o.warn + o.life;
  if (o.age < o.warn || !o.live){
    ctx.save();
    ctx.setLineDash([S * 0.016, S * 0.022]);
    ctx.lineWidth = 3; ctx.lineCap = 'butt';
    ctx.strokeStyle = 'rgba(255,61,110,' + (0.4 + 0.4 * Math.abs(Math.sin(o.age * 14))) + ')';
    arcAt(r, ca, o.half + (BAND * 0.5) / r); ctx.stroke();
    ctx.restore();
    return;
  }
  let k = 1;
  if (o.age > end) k = Math.max(0, 1 - (o.age - end) / 0.3);
  ctx.save();
  ctx.globalAlpha = k;
  ctx.lineCap = 'round';
  ctx.lineWidth = BAND * 1.8 * k; ctx.strokeStyle = 'rgba(255,61,110,.18)';
  arcAt(r, ca, o.half); ctx.stroke();
  ctx.lineWidth = BAND * k; ctx.strokeStyle = '#ff3d6e';
  arcAt(r, ca, o.half); ctx.stroke();
  ctx.lineWidth = BAND * 0.26 * k; ctx.strokeStyle = 'rgba(255,255,255,.5)';
  arcAt(r - BAND * 0.17, ca, o.half * 0.94); ctx.stroke();
  ctx.restore();
}

function showsScore(){ return mode === 'play' || mode === 'pause' || mode === 'dying' || mode === 'wait' || mode === 'over'; }

function draw(){
  const g = G;
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (g.shake > 0.2 && !reduce) ctx.translate((Math.random() - .5) * g.shake, (Math.random() - .5) * g.shake);

  // пыль
  ctx.fillStyle = '#bfe3ff';
  for (const d of dust){
    const a = d.a + bgRot * d.z;
    ctx.globalAlpha = d.o;
    ctx.beginPath();
    ctx.arc(cx + Math.sin(a) * d.r * S, cy - Math.cos(a) * d.r * S, d.s, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // орбиты
  for (let i = 0; i < ORB; i++){
    ctx.lineWidth = BAND * 0.34;
    ctx.strokeStyle = g.lane === i ? 'rgba(160,210,245,.30)' : 'rgba(160,210,245,.15)';
    ctx.beginPath(); ctx.arc(cx, cy, R[i], 0, TAU); ctx.stroke();
    const n = Math.round(TAU * R[i] / (S * 0.05));
    ctx.fillStyle = 'rgba(200,230,250,.5)';
    for (let k = 0; k < n; k++){
      const a = g.world + k * TAU / n;
      ctx.beginPath();
      ctx.arc(cx + Math.sin(a) * R[i], cy - Math.cos(a) * R[i], 1.6, 0, TAU);
      ctx.fill();
    }
  }

  // центр: счёт или обратный отсчёт
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (mode === 'count'){
    const n = Math.ceil(cd - 0.2);
    ctx.font = '800 ' + Math.round(S * (n > 0 ? 0.3 : 0.15)) + 'px ' + FONT;
    ctx.fillStyle = '#ffd23f';
    ctx.fillText(n > 0 ? String(n) : 'Вперёд!', cx, cy);
  } else if (showsScore()){
    const sc = 1 + g.scorePulse * 0.18;
    ctx.save();
    ctx.translate(cx, cy); ctx.scale(sc, sc);
    ctx.font = '800 ' + Math.round(S * 0.2) + 'px ' + FONT;
    ctx.fillStyle = '#f4f7fb';
    ctx.fillText(String(g.score), 0, 0);
    ctx.restore();
    if (g.combo > 1){
      ctx.font = '800 ' + Math.round(S * 0.058) + 'px ' + FONT;
      ctx.fillStyle = '#5cf2c0';
      ctx.fillText('×' + g.combo, cx, cy + S * 0.145);
    }
    if (g.combo > 0 && g.comboT > 0){
      ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.strokeStyle = 'rgba(92,242,192,.7)';
      ctx.beginPath();
      ctx.arc(cx, cy, S * 0.2, -Math.PI / 2, -Math.PI / 2 + TAU * (g.comboT / 2.4));
      ctx.stroke();
    }
  }

  // звёзды
  for (const s of g.stars){
    if (s.taken) continue;
    const sp = pos(s.a + g.world, R[s.lane]);
    const sc = Math.min(1, s.age / 0.25);
    const left = s.life - s.age;
    ctx.globalAlpha = (left < 1.2 && Math.floor(s.age * 10) % 2) ? 0.35 : 1;
    ctx.fillStyle = 'rgba(92,242,192,.18)';
    ctx.beginPath(); ctx.arc(sp[0], sp[1], PR * 1.9 * sc, 0, TAU); ctx.fill();
    ctx.fillStyle = '#5cf2c0';
    starPath(sp[0], sp[1], PR * 1.15 * sc, s.age * 1.5); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // препятствия
  for (const o of g.obs) drawObstacle(o);

  // соперник (призрак)
  if (multi && opp.present && !opp.dead && (mode === 'play' || mode === 'count' || mode === 'dying')){
    const gp = pos(g.angle, opp.r), pr = PR * 1.35;
    drawBall(gp[0], gp[1], opp.skin === 'standard' ? 'standard-2' : opp.skin, pr, 0.88);
    ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.7)';
    ctx.beginPath(); ctx.arc(gp[0], gp[1], pr * 1.3, 0, TAU); ctx.stroke();
  }

  // шлейф и корабль
  if (!g.dead){
    const L = g.trail.length;
    ctx.fillStyle = skinById(skinSel).c;
    for (let i = 0; i < L; i++){
      const t = i / L;
      ctx.globalAlpha = t * 0.35;
      ctx.beginPath(); ctx.arc(g.trail[i][0], g.trail[i][1], PR * (0.3 + 0.6 * t), 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawBall(g.px, g.py, skinSel, PR * 1.35 * (1 + 0.3 * g.squash), 1);
  }

  // частицы
  for (const p of g.parts){
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.s, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // всплывающие очки
  ctx.font = '800 ' + Math.round(S * 0.05) + 'px ' + FONT;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#5cf2c0';
  for (const p of g.pops){
    ctx.globalAlpha = 1 - p.t / 0.7;
    ctx.fillText(p.text, p.x, p.y - p.t * S * 0.12);
  }
  ctx.globalAlpha = 1;

  // подсказка
  if (mode === 'play' && g.taps < 2 && g.t > 0.3){
    ctx.font = '700 ' + Math.max(16, Math.round(S * 0.045)) + 'px ' + FONT;
    ctx.fillStyle = 'rgba(244,247,251,' + (0.55 + 0.35 * Math.sin(g.t * 5)) + ')';
    const hy = H - Math.max(70, H * 0.09), fs = Math.max(16, Math.round(S * 0.045));
    if (ORB === 2) ctx.fillText('Коснись экрана — смени орбиту', cx, hy);
    else {
      ctx.fillText('Тап слева — ближе к центру', cx, hy - fs * 0.75);
      ctx.fillText('Тап справа — дальше от центра', cx, hy + fs * 0.75);
    }
  }

  ctx.restore();

  if (g.flash > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + (g.flash * 0.35) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

let lastAction = 0;
function setBtn(el, spec){
  if (!spec){ el.hidden = true; el.onclick = null; return; }
  el.hidden = false;
  el.className = el.dataset.base + (spec[2] ? ' ' + spec[2] : '');
  el.textContent = spec[0];
  el.disabled = false;
  el.onclick = () => {
    const now = Date.now();
    if (now - lastAction < 300) return;
    lastAction = now;
    spec[1]();
  };
}
function showOverlay(o){
  ovTitle.textContent = o.title || '';
  ovTitle.className = o.small ? 'sm' : '';
  ovTitle.hidden = !o.title;
  ovBig.textContent = o.big == null ? '' : o.big;
  ovBig.hidden = o.big == null;
  ovText.textContent = o.text || '';
  ovText.className = o.record ? 'record' : '';
  ovText.hidden = !o.text;
  ovInput.hidden = !o.input;
  ovList.innerHTML = ''; ovList.className = 'list'; ovList.hidden = !o.list;
  if (o.list) o.list(ovList);
  setBtn(ovBtn, o.btn);
  setBtn(ovBtn2, o.btn2);
  setBtn(ovBtn3, o.btn3);
  setBtn(ovBtn4, o.btn4);
  ov.classList.remove('hidden');
  if (o.after) o.after();
}
function hideOverlay(){ ov.classList.add('hidden'); ovInput.blur(); }

  mode = 'menu';
  if (ORB !== modeSel){ setOrbits(modeSel); newGame(); }
  showOverlay({
    title: 'Орбита',
    text: 'Касайся экрана — корабль перепрыгнет на другую орбиту. Лови звёзды и обходи розовые дуги.\n' +
          modeName(modeSel) + (bests[modeSel] > 0 ? ' · Рекорд: ' + bests[modeSel] : ''),
    btn: ['Играть', startGame],
    btn2: ['Игра с другом', showLobbyChoice],
    btn3: ['Режимы', showModes, 'chip'],
    btn4: ['Дорога славы', showRoad, 'chip']
  });
}
function toMenu(){
  multi = false; match.active = false;
  setOrbits(modeSel);
  newGame();
  pauseBtn.style.display = 'none';
  bestHud.style.display = 'none';
  showMenu();
}
function startGame(){
  audio();
  multi = false;
  setOrbits(modeSel);
  newGame();
  mode = 'play'; acc = 0;
  hideOverlay();

function gloryText(){
  let t = '';
  if (G.score > 0) t += '\n+' + G.score + ' ' + plural(G.score, ['очко', 'очка', 'очков']) + ' славы';
  if (pendingUnlocks.length) t += '\nНовый скин: ' + pendingUnlocks.map(k => k.name).join(', ') + '!';

}
function showOver(){
  mode = 'over';
  bestHud.style.display = 'none';
  const unlocked = pendingUnlocks.length > 0;
  showOverlay({
    title: 'Столкновение',
    big: G.score,
    text: (newRecord ? 'Новый рекорд!' : 'Рекорд: ' + bests[ORB]) + gloryText(),

    btn: ['Ещё раз', startGame],
    btn2: unlocked ? ['Дорога славы', showRoad] : null,

/* --- дорога славы --- */
function showRoad(){
  mode = 'menu';
  const render = box => {
    box.className = 'list road';
    const keep = box.scrollTop;
    const skins = SKINS.filter(k => !k.hidden);
    let prev = 0, firstLocked = true;
    skins.forEach(sk => {
      const open = glory >= sk.need;
      const node = document.createElement('div');
      node.className = 'node' + (open ? ' open' : '') + (open && sk.id === skinSel ? ' sel' : '');

      const im = new Image(); im.className = 'sk'; im.alt = ''; im.draggable = false; im.src = sk.file;
      im.onerror = () => {
        const ph = document.createElement('div'); ph.className = 'sk ph';
        ph.style.background = 'radial-gradient(circle at 35% 30%, #fff9, ' + sk.c + ' 62%)';
        im.replaceWith(ph);
      };
      const tx = document.createElement('div'); tx.className = 'tx';
      const nm = document.createElement('b'); nm.textContent = sk.name;
      const sub = document.createElement('span');
      tx.append(nm, sub);
      node.append(im, tx);

      if (open){
        sub.textContent = sk.need === 0 ? 'Открыт с самого начала' : 'Открыт';
        const tag = document.createElement('div'); tag.className = 'tag';
        tag.textContent = sk.id === skinSel ? 'Выбран ✓' : 'Выбрать';
        node.append(tag);
        node.onclick = () => {
          if (skinSel === sk.id) return;
          skinSel = sk.id; store.set('orbit-skin', skinSel);
          tone(660, .1, 'sine', .1);
          box.innerHTML = ''; render(box);
        };
      } else {
        sub.textContent = 'Нужно очков славы: ' + sk.need;
        if (firstLocked){
          firstLocked = false;
          const bar = document.createElement('div'); bar.className = 'bar';
          const fill = document.createElement('i');
          fill.style.width = Math.max(4, Math.min(100, (glory - prev) / (sk.need - prev) * 100)) + '%';
          bar.appendChild(fill); tx.appendChild(bar);
          sub.textContent = 'Ещё ' + (sk.need - glory) + ' ' + plural(sk.need - glory, ['очко', 'очка', 'очков']) + ' славы';
        }
        node.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>');
      }
      prev = sk.need;
      box.appendChild(node);
    });
    box.scrollTop = keep;
  };
  showOverlay({
    title: 'Дорога славы', small: true,
    text: 'Очки славы: ' + glory + '\nКаждая набранная звезда — шаг по дороге.',
    list: render,
    btn2: ['Назад', showMenu],
    after: () => {                                   // сразу показываем ближайший закрытый скин
      const t = ovList.querySelector('.node:not(.open)');
      if (t) ovList.scrollTop = Math.max(0, t.offsetTop - ovList.clientHeight / 2 + t.offsetHeight / 2);
    }
  });
}
function pauseGame(){
  if (mode !== 'play' || multi) return;
  mode = 'pause';
  pauseBtn.style.display = 'none';
  showOverlay({ title: 'Пауза', text: 'Очки: ' + G.score, btn: ['Продолжить', resumeGame], btn3: ['В меню', toMenu] });
}
function resumeGame(){
  mode = 'play'; acc = 0;
  hideOverlay();
  pauseBtn.style.display = 'grid';
}

/* ---------- Сеть ---------- */
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genCode(){ let s = ''; for (let i = 0; i < 4; i++) s += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return s; }
function netAvailable(){
  return !!(window.supabase && /^https:\/\/[^\s]+\.supabase\.(co|in)/.test(SUPABASE_URL) && SUPABASE_KEY.length > 20);
}

function showLobbyChoice(){
  mode = 'lobby';
  if (!netAvailable()){
    showOverlay({
      title: 'Сервер не подключён',
      text: window.supabase
        ? 'Откройте файл в редакторе и вставьте адрес проекта и ключ Supabase в начало файла.'
        : 'Не загрузилась библиотека Supabase. Проверьте интернет и обновите страницу.',
      btn: ['Назад', showMenu]
    });
    return;
  }
  showOverlay({
    title: 'Игра с другом',
    text: 'Создай комнату и отправь код другу — сыграете в режиме «' + modeName(modeSel) + '». Или введи код, который прислал друг.',
    input: true,
    btn: ['Создать комнату', createRoom],
    btn2: ['Войти по коду', joinByInput],
    btn3: ['Назад', showMenu]
  });
  ovInput.value = '';
}
function createRoom(){ enterRoom(genCode()); }
function joinByInput(){
  const c = ovInput.value.trim().toUpperCase();
  if (c.length !== 4){ ovText.hidden = false; ovText.textContent = 'Код состоит из 4 символов.'; return; }
  enterRoom(c);
}
function enterRoom(code){
  audio();
  leaveRoom(true);
  multi = true; NET.code = code;
  opp.present = false; opp.score = 0; opp.dead = false; opp.rematch = false; myRematch = false;
  showWaiting('Подключаемся…');
  connect(code);
}
function showWaiting(text){
  mode = 'lobby';
  showOverlay({
    title: 'Комната',
    big: NET.code,
    text,
    btn: ['Отправить ссылку', shareLink],
    btn3: ['Выйти', () => leaveRoom()]
  });
}
async function shareLink(){
  const url = location.href.split('#')[0] + '#' + NET.code;
  try {
    if (navigator.share){ await navigator.share({ title: 'Орбита', text: 'Сыграем в «Орбиту»! Код комнаты: ' + NET.code, url }); return; }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(url); ovText.hidden = false; ovText.textContent = 'Ссылка скопирована. Отправь её другу.'; }
  catch(e){ ovText.hidden = false; ovText.textContent = 'Скопируй ссылку вручную: ' + url; }
}

function connect(code){
  try {
    if (!NET.client) NET.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { realtime: { params: { eventsPerSecond: 20 } } });
    const ch = NET.client.channel('orbit:' + code, { config: { broadcast: { self: false }, presence: { key: NET.myId } } });
    ch.on('broadcast', { event: 'start' },   m => onStart(m.payload))
      .on('broadcast', { event: 'state' },   m => onOppState(m.payload))
      .on('broadcast', { event: 'rematch' }, () => { opp.rematch = true; checkRematch(); })
      .on('presence',  { event: 'sync' },    onPresence)
      .subscribe(status => {
        if (!multi) return;
        if (status === 'SUBSCRIBED'){
          ch.track({ id: NET.myId, t: Date.now(), k: skinSel });
          if (mode === 'lobby' && !opp.present) showWaiting('Ждём второго игрока. Отправь ему код или ссылку.');
        } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED'){
          showNetError();
        }
      });
    NET.ch = ch;
  } catch(e){ showNetError(); }
}
function showNetError(){
  leaveRoom(true);
  showOverlay({
    title: 'Нет соединения',
    text: 'Не удалось подключиться к серверу. Проверьте интернет и настройки Supabase.',
    btn: ['Назад', showMenu]
  });
}
function leaveRoom(silent){
  multi = false; match.active = false;
  try { if (NET.ch && NET.client){ NET.ch.untrack(); NET.client.removeChannel(NET.ch); } } catch(e){}
  NET.ch = null; NET.code = '';
  pendingUnlocks = [];
  opp.present = false; opp.rematch = false; myRematch = false;
  try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  pauseBtn.style.display = 'none'; bestHud.style.display = 'none';
  mode = 'menu';
  setOrbits(modeSel);
  newGame();
  if (!silent) showMenu();
}

function onPresence(){
  if (!multi || !NET.ch) return;
  const st = NET.ch.presenceState(), list = [];
  for (const k in st){ const m = st[k][0]; if (m && m.id) list.push(m); }
  list.sort((a, b) => (a.t - b.t) || (a.id < b.id ? -1 : 1));
  const idx = list.findIndex(p => p.id === NET.myId);
  if (idx < 0) return;
  if (idx >= 2){
    leaveRoom(true);
    showOverlay({ title: 'Комната занята', text: 'В этой комнате уже играют двое.', btn: ['Назад', showMenu] });
    return;
  }
  NET.host = idx === 0;
  const had = opp.present;
  const other = list.slice(0, 2).find(p => p.id !== NET.myId);
  opp.present = !!other;
  opp.skin = other && skinOk(other.k) ? other.k : 'standard';
  if (opp.present && !had){
    if (mode === 'lobby'){
      showWaiting(NET.host ? 'Друг на связи! Начинаем…' : 'Подключились! Ждём старт…');
      if (NET.host) setTimeout(() => { if (multi && mode === 'lobby' && opp.present) hostStart(); }, 900);
    }
  } else if (!opp.present && had){
    opponentLeft();
  }
}
function opponentLeft(){
  if (mode === 'lobby'){ showWaiting('Друг вышел. Ждём второго игрока.'); return; }
  if (match.active){ endMatch('win', ' (соперник вышел)'); return; }
  if (mode === 'over'){ ovBtn.disabled = true; ovBtn.textContent = 'Соперник вышел'; }
}

function hostStart(){
  if (!NET.ch || !multi) return;
  const seed = (Math.random() * 2147483647) >>> 0;
  NET.ch.send({ type: 'broadcast', event: 'start', payload: { seed, orbits: modeSel } });
  onStart({ seed, orbits: modeSel });
}
function onStart(p){
  if (!multi || !p) return;
  audio();
  setOrbits(p.orbits === 3 ? 3 : 2);                 // число орбит задаёт хозяин комнаты
  const myLane = NET.host ? ORB - 1 : 0;             // хозяин — на внешней орбите, гость — на внутренней
  opp.score = 0; opp.dead = false; opp.lane = NET.host ? 0 : ORB - 1; opp.r = R[opp.lane]; opp.rematch = false; myRematch = false;
  match.active = true;
  newGame(p.seed >>> 0, myLane);
  mode = 'count'; cd = 3.2;
  hideOverlay();
  pauseBtn.style.display = 'none';
  bestHud.style.display = 'block';
}
function onOppState(p){
  if (!multi || !p) return;
  opp.lane = Math.max(0, Math.min(ORB - 1, p.l | 0));
  opp.score = p.s | 0;
  opp.dead = !!p.d;
  if (mode === 'wait') updateWait();
  evaluate();
}
function netSend(force){
  if (!multi || !NET.ch || !G) return;
  const now = Date.now();
  if (!force && now - NET.lastSend < 70) return;
  NET.lastSend = now;
  try { NET.ch.send({ type: 'broadcast', event: 'state', payload: { l: G.lane, s: G.score, d: G.dead ? 1 : 0 } }); } catch(e){}
}

/* --- результат гонки --- */
function evaluate(){
  if (!multi || !match.active) return;
  const me = G;
  if (!me.dead){
    if (opp.dead && me.score > opp.score) endMatch('win');
  } else if (mode === 'wait'){
    if (opp.dead) endMatch(me.score > opp.score ? 'win' : me.score < opp.score ? 'lose' : 'draw');
    else if (opp.score > me.score) endMatch('lose');
  }
}
function updateWait(){
  ovText.hidden = false;
  ovText.textContent = 'Соперник ещё в игре. Его счёт: ' + opp.score;
}
function afterDeath(){
  if (!multi){ showOver(); return; }
  mode = 'wait';
  showOverlay({ title: 'Ты вылетел', big: G.score, text: '', btn3: ['Выйти', () => leaveRoom()] });
  updateWait();
  evaluate();
}
function endMatch(result, note){
  if (!match.active) return;
  match.active = false;
  netSend(true);
  mode = 'over';
  pauseBtn.style.display = 'none'; bestHud.style.display = 'none';
  if (result === 'win'){ burst(cx, cy, '#ffd23f', 60, S * 0.9, S * 0.014); tone(784, .25, 'triangle', .14); buzz([30, 40, 30]); }
  showOverlay({
    title: result === 'win' ? 'Победа!' : result === 'lose' ? 'Поражение' : 'Ничья',
    big: G.score,
    text: 'Соперник: ' + opp.score + (note || '') + gloryText(),
    record: result === 'win',
    btn: ['Реванш', requestRematch],
    btn3: ['Выйти', () => leaveRoom()]
  });
  if (!opp.present) { ovBtn.disabled = true; ovBtn.textContent = 'Соперник вышел'; }
  pendingUnlocks = [];
}
function requestRematch(){
  myRematch = true;
  ovBtn.disabled = true; ovBtn.textContent = 'Ждём соперника…';
  try { NET.ch && NET.ch.send({ type: 'broadcast', event: 'rematch', payload: {} }); } catch(e){}
  checkRematch();
}
function checkRematch(){ if (multi && myRematch && opp.rematch && NET.host) hostStart(); }

/* ---------- Ввод ---------- */
function tap(dir){
  if (mode !== 'play' || G.dead) return;
  // 2 орбиты: тап переключает орбиту. 3 орбиты: dir = -1 ближе к центру, +1 дальше от центра
  const nl = ORB === 2 ? G.lane ^ 1 : Math.max(0, Math.min(ORB - 1, G.lane + (dir || 1)));
  G.taps++;
  if (nl === G.lane) return;
  const out = nl > G.lane;
  G.lane = nl; G.squash = 1;
  if (out) tone(330, .09, 'triangle', .1, 220); else tone(494, .09, 'triangle', .1, 740);
  buzz(8);
  netSend(false);
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); audio(); tap(e.clientX < W / 2 ? -1 : 1); });
pauseBtn.addEventListener('click', pauseGame);
muteBtn.addEventListener('click', () => {
  muted = !muted; store.set('orbit-muted', muted ? '1' : '0'); renderMute();
  if (!muted) tone(660, .1, 'sine', .1);
});
ovInput.addEventListener('input', () => { ovInput.value = ovInput.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });
ovInput.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); joinByInput(); } });
window.addEventListener('keydown', e => {
  if (e.target === ovInput) return;
  const k = e.code;
  if (mode === 'play'){
    if (k === 'Space' || k === 'Enter' || k === 'ArrowUp' || k === 'ArrowRight' || k === 'ArrowDown' || k === 'ArrowLeft'){
      e.preventDefault();
      let d = (k === 'ArrowDown' || k === 'ArrowLeft') ? -1 : 1;
      if ((k === 'Space' || k === 'Enter') && G.lane === ORB - 1) d = -1;
      tap(d);
    } else if (k === 'KeyP' || k === 'Escape'){
      pauseGame();
    }
  } else if (k === 'Space' || k === 'ArrowUp' || k === 'ArrowDown' || k === 'Enter'){
    if ((mode === 'menu' || mode === 'over' || mode === 'pause') && !ovBtn.hidden && !ovBtn.disabled){ e.preventDefault(); ovBtn.click(); }
  }
});
document.addEventListener('visibilitychange', () => { if (document.hidden && !multi) pauseGame(); });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 150));
window.addEventListener('pagehide', () => { try { if (NET.ch && NET.client) NET.client.removeChannel(NET.ch); } catch(e){} });

/* ---------- Цикл ---------- */
let last = 0, lastHud = '';
function frame(ts){
  const real = Math.min(0.1, (ts - last) / 1000 || 0.016);
  last = ts;

  if (mode === 'play'){
    acc += real;
    let n = 0;
    while (acc >= STEP && n < 6){
      update(STEP); acc -= STEP; n++;
      if (mode !== 'play') break;
    }
    if (n >= 6) acc = 0;
    if (multi && mode === 'play'){
      NET.sendT += real;
      if (NET.sendT >= 0.11){ NET.sendT = 0; netSend(false); }
      evaluate();
    }
  } else if (mode === 'menu' || mode === 'lobby'){
    idle(real);
  } else if (mode === 'count'){
    cd -= real;
    if (cd <= 0){ mode = 'play'; acc = 0; NET.sendT = 0; }
  } else if (mode === 'dying'){
    fxUpdate(real);
    G.deadT += real;
    if (G.deadT > 0.85) afterDeath();
  } else if (mode === 'over' || mode === 'wait'){
    fxUpdate(real);
  }

  if (multi && (mode === 'count' || mode === 'play' || mode === 'dying')){
    const t = 'Соперник: ' + opp.score + (opp.dead ? ' (вылетел)' : '');
    if (t !== lastHud){ lastHud = t; bestHud.textContent = t; }
  }

  bgRot = G.world * 0.5 + ts * 0.00003;
  draw();
  requestAnimationFrame(frame);
}

/* ---------- Запуск ---------- */
resize();
newGame();
loadSkins();
renderMute();
showMenu();
requestAnimationFrame(frame);

// переход по ссылке-приглашению вида …/orbit.html#K7QD
const hash = (location.hash || '').slice(1).toUpperCase();
if (/^[A-HJ-NP-Z2-9]{4}$/.test(hash)){
  if (netAvailable()) enterRoom(hash); else showLobbyChoice();
}
})();
</script>
